<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>팬데믹 대통령 · 명예의 전당</title>
<style>
:root{
  --bg:#101418;--surface-0:#171c22;--surface-1:#1d232b;--surface-2:#1a2027;
  --border:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.22);
  --text-primary:#e9ecef;--text-secondary:#a7afb8;--text-muted:#6b737d;
  --danger:#f0605f;--success:#3fc38f;--warning:#eda100;--blue:#4a8fe0;--purple:#8b7cf6;
  --gold:#f5c451;--silver:#c9d1d9;--bronze:#d08b5b;
  --radius:10px;
  --font-ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:var(--text-primary);background:var(--surface-0);border:1px solid var(--border-strong);border-radius:10px;padding:9px 14px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;padding:22px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.eyebrow{font-size:11px;letter-spacing:3px;color:var(--text-muted);margin-bottom:6px}
h1{font-size:28px;line-height:1.15;margin:0}
.live{display:flex;align-items:flex-start;gap:7px;font-size:12px;line-height:1.5;color:var(--text-secondary);margin-top:8px}
.live .dot{margin-top:5px;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 0 rgba(63,195,143,.6);animation:ping 1.8s infinite}
.dot.off{background:var(--danger);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(63,195,143,.55)}70%{box-shadow:0 0 0 8px rgba(63,195,143,0)}100%{box-shadow:0 0 0 0 rgba(63,195,143,0)}}
.prog{height:2px;background:rgba(255,255,255,.06);border-radius:1px;overflow:hidden;margin-top:10px;max-width:220px}
.prog span{display:block;height:100%;width:0;background:var(--purple)}
.play{flex-shrink:0;text-decoration:none;font-size:13px;font-weight:600;padding:10px 14px;border-radius:10px;background:#6250d6;border:1px solid #6250d6}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.6;border:1px solid var(--border);background:var(--surface-2)}
.banner b{font-size:18px}
.banner.me{border-color:rgba(139,124,246,.55);background:linear-gradient(135deg,rgba(139,124,246,.18),var(--surface-2) 70%)}
.banner.err{border-color:rgba(240,96,95,.5)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tile{background:var(--surface-1);border-radius:var(--radius);padding:10px 12px;min-width:0}
.tile .k{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:20px;font-weight:700;margin-top:2px}
.layout{display:block}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex-shrink:0;font-size:13px;padding:8px 13px}
.tabs button[aria-selected="true"]{border-color:var(--purple);background:rgba(139,124,246,.14);font-weight:600}
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 15px;margin-bottom:12px}
.lab{font-size:11px;letter-spacing:2px;color:var(--text-muted);margin-bottom:10px}
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:8px;align-items:end;margin-bottom:12px}
.pod{border-radius:12px;padding:12px 8px 12px;text-align:center;background:var(--surface-1);border:1px solid var(--border);min-width:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.pod .medal{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#14181d}
.pod .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .sc{font-size:22px;font-weight:800;margin:4px 0 2px}
.pod .ld{font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod.p1{padding-top:18px;padding-bottom:18px;border-color:rgba(245,196,81,.5);background:linear-gradient(180deg,rgba(245,196,81,.16),var(--surface-1) 70%)}
.pod.p1 .sc{font-size:28px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);animation:rise .35s ease-out both}
.row:last-child{border-bottom:none}
.rk{width:30px;text-align:center;font-size:15px;font-weight:700;color:var(--text-secondary);flex-shrink:0}
.who{flex:1;min-width:0}
.who .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .mt{font-size:12px;color:var(--text-secondary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .ex{font-size:11px;color:var(--text-muted);margin-top:3px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.val{text-align:right;flex-shrink:0}
.val .b{font-size:18px;font-weight:800}
.val .s{font-size:11px;color:var(--text-muted)}
.g{display:inline-block;min-width:16px;text-align:center;font-size:10px;font-weight:800;border-radius:4px;padding:1px 3px;background:rgba(255,255,255,.07)}
.row.mine{background:rgba(139,124,246,.13);border-radius:10px;box-shadow:inset 3px 0 0 var(--purple)}
.row.fresh,.pod.fresh{animation:fresh 2.4s ease-out both}
@keyframes fresh{0%{background:rgba(63,195,143,.35)}100%{background:transparent}}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--success);color:#0f1a14}
.hb{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px}
.hb .n{width:118px;flex-shrink:0;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.hb .tr span{position:absolute;left:0;top:0;bottom:0;border-radius:5px;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.hb .c{width:34px;text-align:right;color:var(--text-muted);flex-shrink:0}
@keyframes grow{from{width:0}}
.note{font-size:12px;color:var(--text-muted);line-height:1.6;margin-top:8px}
.empty{text-align:center;padding:36px 10px;color:var(--text-secondary);font-size:14px;line-height:1.8}
.skel{height:52px;border-radius:10px;background:linear-gradient(90deg,var(--surface-1),#232a33,var(--surface-1));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:8px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
#statsWide{display:none}
@media (min-width:960px){
  .tiles{grid-template-columns:repeat(6,1fr)}
  .layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
  #statsWide{display:block}
  .tabs button[data-t="stats"]{display:none}
  h1{font-size:34px}
}
.settled .row,.settled .pod,.settled .hb .tr span{animation:none}
.settled .row.fresh,.settled .pod.fresh{animation:fresh 2.4s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div>
      <div class="eyebrow">팬데믹 대통령</div>
      <h1>명예의 전당</h1>
      <div class="live"><span class="dot" id="dot"></span><span id="liveTxt">불러오는 중</span></div>
      <div class="prog"><span id="prog"></span></div>
    </div>
    <a class="play" href="index.html">게임 하러 가기</a>
  </div>
  <div id="banner"></div>
  <div class="tiles" id="tiles"></div>
  <div class="layout">
    <section>
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-t="top" aria-selected="true">커리어 점수</button>
        <button role="tab" data-t="longest" aria-selected="false">최장 집권</button>
        <button role="tab" data-t="recent" aria-selected="false">최근 기록</button>
        <button role="tab" data-t="stats" aria-selected="false">권력 통계</button>
      </div>
      <div id="board"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    </section>
    <aside id="statsWide"></aside>
  </div>
</div>
<script>
(function(){
// 게임(index.html)과 같은 Apps Script 웹 앱 주소
const API='https://script.google.com/macros/s/AKfycbwN85Q_Ms0h-H2UjT6dRiDFqGYdpJuAaP1Uib7KtEoRFCqrKjiT_kIZPly1DzfgmhtH/exec';
const REFRESH=15000;
const Q=new URLSearchParams(location.search),MY_ID=Q.get('id')||'',MY_NICK=Q.get('me')||'',DEMO=Q.get('demo')==='1';
const LCOL={'킨키나투스':'#4a8fe0','조지 워싱턴':'#4a8fe0','루이 14세':'#f0605f','나폴레옹':'#f0605f','진시황':'#f0605f','루이 16세':'#8a9099',
  '마르쿠스 아우렐리우스':'#8b7cf6','율리우스 카이사르':'#eb6834','에이브러햄 링컨':'#3fc38f','세종':'#3fc38f','페리클레스':'#8a9099',
  '술라':'#eb6834','솔론':'#4a8fe0','정조':'#3fc38f','프리드리히 2세':'#eb6834','표트르 대제':'#f0605f','오토 폰 비스마르크':'#eb6834','아우구스투스':'#f0605f',
  '프랭클린 루스벨트':'#8b7cf6','광해군':'#8a9099','윈스턴 처칠':'#4a8fe0','아소카':'#3fc38f','시몬 볼리바르':'#eb6834','함무라비':'#8b7cf6'};
const GC={S:'#3fc38f',A:'#3fc38f',B:'#4a8fe0',C:'#8a9099',D:'#eb6834',F:'#f0605f'};
let data=null,tab='top',seen=null,fresh=new Set(),lastOk=0,t0=0,loading=false,lastSig='',settleT=0;
// 처음 그릴 때와 탭을 바꿀 때만 등장 애니메이션을 보여주고, 자동 갱신 때는 새 기록만 반짝인다
function animateOnce(){document.body.classList.remove('settled');clearTimeout(settleT);settleT=setTimeout(()=>document.body.classList.add('settled'),1600);}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function ago(t){const d=(Date.now()-new Date(t).getTime())/1000;if(!isFinite(d))return '';if(d<60)return '방금';if(d<3600)return Math.floor(d/60)+'분 전';if(d<86400)return Math.floor(d/3600)+'시간 전';
  const x=new Date(t);return (x.getMonth()+1)+'월 '+x.getDate()+'일';}
function grades(s){return String(s||'').split('/').filter(Boolean).map(g=>'<span class="g" style="color:'+(GC[g]||'#a7afb8')+'">'+esc(g)+'</span>').join('');}
function meta(r){return esc(r.bg)+' · '+r.terms+'선 '+r.years+'년 · <span style="color:'+(LCOL[r.leader]||'#a7afb8')+'">'+esc(r.leader)+'</span>';}

/* ---------- 데이터 받기: fetch가 막히면 JSONP로 ---------- */
function jsonp(){return new Promise((res,rej)=>{const cb='__lb'+Date.now()+Math.floor(Math.random()*1e4),s=document.createElement('script');
  const done=()=>{clearTimeout(to);try{delete window[cb];}catch(e){window[cb]=undefined;}s.remove();};
  const to=setTimeout(()=>{done();rej(new Error('시간 초과'));},12000);
  window[cb]=d=>{done();res(d);};s.onerror=()=>{done();rej(new Error('연결 실패'));};
  s.src=API+'?callback='+cb+'&t='+Date.now();document.head.appendChild(s);});}
function getData(){if(DEMO)return Promise.resolve(demo());
  return fetch(API+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).catch(()=>jsonp());}

function load(){if(loading)return;loading=true;
  getData().then(d=>{
    if(!d||!Array.isArray(d.top))throw new Error('형식이 다른 응답');
    const sig=JSON.stringify(Object.assign({},d,{updated:0}));
    data=d;lastOk=Date.now();setLive(true);
    if(sig===lastSig)return;lastSig=sig;
    const ids=new Set((d.recent||[]).map(r=>r.id));
    fresh=new Set();if(seen)ids.forEach(id=>{if(!seen.has(id))fresh.add(id);});
    if(!seen)animateOnce();seen=ids;render();
  }).catch(e=>{setLive(false,e);if(!data)renderError(e);}).finally(()=>{loading=false;t0=Date.now();});}
function setLive(ok,e){$('dot').className='dot'+(ok?'':' off');
  if(ok){const u=data&&data.updated?new Date(data.updated):new Date();
    $('liveTxt').textContent=(DEMO?'예시 데이터 · ':'실시간 · ')+'15초마다 갱신 · '+u.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' 기준';}
  else $('liveTxt').textContent='연결이 끊겼어요 · 다시 시도하는 중'+(lastOk?' (마지막 성공 '+ago(lastOk)+')':'');}
function tickProg(){const k=Math.min(1,(Date.now()-t0)/REFRESH);$('prog').style.width=(k*100)+'%';
  if(k>=1&&!document.hidden)load();requestAnimationFrame(tickProg);}

/* ---------- 그리기 ---------- */
function render(){renderBanner();renderTiles();renderBoard();$('statsWide').innerHTML=statsHtml();}
function renderBanner(){const b=$('banner');
  if(DEMO){b.innerHTML='<div class="banner">지금 보이는 건 <b style="font-size:14px">예시 데이터</b>예요. 주소에서 <code>?demo=1</code>을 지우면 실제 기록이 나와요.</div>';return;}
  if(!MY_ID){b.innerHTML='';return;}
  const rk=data.order.indexOf(MY_ID)+1;
  if(rk)b.innerHTML='<div class="banner me">'+(MY_NICK?esc(MY_NICK)+' 대통령의 이번 커리어는 ':'이번 커리어는 ')+'<b>'+rk+'위</b> <span style="color:var(--text-secondary)">/ 전체 '+data.order.length+'개 커리어</span>'+
    (rk>30?'<div class="note" style="margin-top:4px">점수 순위표에는 상위 30명까지만 보여요.</div>':'')+'</div>';
  else b.innerHTML='<div class="banner me">방금 끝낸 커리어를 시트에 반영하는 중이에요. <span style="color:var(--text-secondary)">잠시 뒤 자동으로 순위가 나타나요.</span></div>';}
function renderTiles(){const s=data.stats||{},t=(k,v)=>'<div class="tile"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
  $('tiles').innerHTML=t('지나간 인생',data.careers||0)+t('참가자',data.players||0)+t('평균 임기',(s.avgTerms||0)+'선')+t('연임 성공률',(s.reelectRate||0)+'%')+t('개헌한 비율',(s.amendRate||0)+'%')+t('스스로 퇴임',(s.retireRate||0)+'%');}
function rowHtml(r,i,mode){const cls='row'+(r.id===MY_ID?' mine':'')+(fresh.has(r.id)?' fresh':'');
  const right=mode==='longest'?'<div class="b">'+r.years+'<span style="font-size:12px">년</span></div><div class="s">'+r.score+'점</div>':
    mode==='recent'?'<div class="b">'+r.score+'</div><div class="s">'+esc(ago(r.t))+'</div>':'<div class="b">'+r.score+'</div><div class="s">'+r.terms+'선</div>';
  const rk=mode==='recent'?'<span style="font-size:11px;color:var(--text-muted)">'+(data.order.indexOf(r.id)+1||'–')+'위</span>':i+1;
  return '<div class="'+cls+'" style="animation-delay:'+Math.min(i,12)*35+'ms"><div class="rk">'+rk+'</div><div class="who"><div class="nm">'+esc(r.nick)+(fresh.has(r.id)?' <span class="tag">NEW</span>':'')+'</div>'+
    '<div class="mt">'+meta(r)+'</div><div class="ex">'+grades(r.grades)+'<span>'+esc(r.exit)+'</span>'+(r.amend?'<span style="color:var(--danger)">· 개헌 '+r.amend+'회</span>':'')+'</div></div><div class="val">'+right+'</div></div>';}
function podium(list){const m=[list[1],list[0],list[2]],cls=['p2','p1','p3'],col=['var(--silver)','var(--gold)','var(--bronze)'],rk=[2,1,3];
  return '<div class="podium">'+m.map((r,j)=>r?'<div class="pod '+cls[j]+(fresh.has(r.id)?' fresh':'')+'" style="animation-delay:'+[120,0,220][j]+'ms;'+(r.id===MY_ID?'box-shadow:0 0 0 2px var(--purple);':'')+'">'+
    '<div class="medal" style="background:'+col[j]+'">'+rk[j]+'</div><div class="nm">'+esc(r.nick)+'</div><div class="sc">'+r.score+'</div><div class="ld">'+r.terms+'선 · '+esc(r.leader)+'</div></div>':'<div></div>').join('')+'</div>';}
function renderBoard(){const B=$('board');
  if(tab==='stats'){B.innerHTML=statsHtml();return;}
  const list=data[tab]||[];
  if(!list.length){B.innerHTML='<div class="card empty">아직 기록이 없어요.<br>첫 번째 대통령이 되어 보세요.<div style="margin-top:14px"><a class="play" href="index.html">게임 하러 가기</a></div></div>';return;}
  if(tab==='top'){B.innerHTML=podium(list)+(list.length>3?'<div class="card" style="padding:4px 11px">'+list.slice(3).map((r,i)=>rowHtml(r,i+3,'top')).join('')+'</div>':'')+
    '<div class="note">한 사람의 가장 높은 커리어만 순위에 올라요. 커리어 점수(100점) = 성과 70 + 연임 15 + 명예 15.</div>';return;}
  B.innerHTML='<div class="card" style="padding:4px 11px">'+list.map((r,i)=>rowHtml(r,i,tab)).join('')+'</div>'+
    (tab==='longest'?'<div class="note">재임 기간이 같으면 커리어 점수가 높은 순서예요.</div>':'<div class="note">순위와 상관없이 가장 최근에 끝난 커리어 15개예요.</div>');}
function hbars(obj,colf){const a=Object.entries(obj||{}).sort((x,y)=>y[1]-x[1]);if(!a.length)return '<div class="note">아직 데이터가 없어요.</div>';const mx=a[0][1];
  return a.map(([k,v],i)=>'<div class="hb"><span class="n">'+esc(k)+'</span><span class="tr"><span style="width:'+(v/mx*100)+'%;background:'+colf(k)+';animation-delay:'+i*50+'ms"></span></span><span class="c">'+v+'</span></div>').join('');}
function dirChart(rows){const W=320,H=150,mid=75,bw=(W-20)/5,sc=v=>Math.max(-1,Math.min(1,v/12))*58;
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="임기별 평균 권력 방향">';
  s+='<line x1="8" x2="'+(W-8)+'" y1="'+mid+'" y2="'+mid+'" stroke="rgba(255,255,255,.25)"/>';
  s+='<text x="10" y="12" font-size="9" fill="rgba(255,255,255,.45)">권력 집중 ↑</text><text x="10" y="'+(H-4)+'" font-size="9" fill="rgba(255,255,255,.45)">견제·분산 ↓</text>';
  rows.forEach((r,i)=>{const x=10+i*bw+bw*.22,w=bw*.56,cx=x+w/2;
    s+='<text x="'+cx+'" y="'+(mid+(r.avg>=0||r.avg===null?14:-6))+'" font-size="10" text-anchor="middle" fill="rgba(255,255,255,.6)">'+r.term+'기</text>';
    if(r.avg===null){s+='<text x="'+cx+'" y="'+(mid-6)+'" font-size="9" text-anchor="middle" fill="rgba(255,255,255,.3)">없음</text>';return;}
    const h=sc(r.avg),y=h>=0?mid-h:mid,col=h>=0?'#f0605f':'#4a8fe0';
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(2,Math.abs(h)).toFixed(1)+'" rx="3" fill="'+col+'"/>';
    s+='<text x="'+cx+'" y="'+(h>=0?y-5:y+Math.abs(h)+12).toFixed(1)+'" font-size="10" font-weight="700" text-anchor="middle" fill="'+col+'">'+(r.avg>0?'+':'')+r.avg+'</text>';
    s+='<text x="'+cx+'" y="'+(h>=0?mid+26:mid-18)+'" font-size="8" text-anchor="middle" fill="rgba(255,255,255,.35)">'+r.n+'명</text>';});
  return s+'</svg>';}
function statsHtml(){if(!data)return '';const s=data.stats||{};const dt=s.dirByTerm||[];
  const exitCol=k=>/퇴임/.test(k)?'#4a8fe0':/실패|출마|패배/.test(k)?'#8a9099':/이탈/.test(k)?'#6b737d':'#f0605f';
  return '<div class="card"><div class="lab">임기가 거듭될수록 선택은 어디로 향했나</div>'+dirChart(dt.length?dt:[1,2,3,4,5].map(t=>({term:t,n:0,avg:null})))+
    '<div class="note">각 임기에서 고른 선택들의 평균 권력 방향 점수예요. 위로 갈수록 권력 집중, 아래로 갈수록 견제·분산. 막대 아래 숫자는 그 임기까지 간 커리어 수예요.</div></div>'+
    '<div class="card"><div class="lab">닮은 지도자 분포</div>'+hbars(s.leaders,k=>LCOL[k]||'#8b7cf6')+'</div>'+
    '<div class="card"><div class="lab">어떻게 물러났나</div>'+hbars(s.exits,exitCol)+'</div>'+
    '<div class="card"><div class="lab">출신 배경</div>'+hbars(s.backgrounds,()=>'#8b7cf6')+'</div>';}
function renderError(e){$('board').innerHTML='<div class="card empty">기록을 불러오지 못했어요.<div class="note" style="margin-top:6px">Apps Script를 최신 코드로 바꾸고 <b>새 버전으로 배포</b>했는지 확인해 주세요.<br>('+esc(e&&e.message||e)+')</div>'+
  '<div style="margin-top:14px"><button id="retry">다시 시도</button></div></div>';const r=$('retry');if(r)r.onclick=()=>{$('board').innerHTML='<div class="skel"></div><div class="skel"></div>';load();};}

$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(!b)return;tab=b.dataset.t;
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===b?'true':'false'));if(data){animateOnce();renderBoard();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-t0>3000)load();});

/* ---------- 예시 데이터 (?demo=1) ---------- */
function demo(){const L=Object.keys(LCOL),BGS=['감염병 학자','기업인','인권 변호사','군 장성','정치 명문가'],EX=['명예롭게 퇴임했다','지지율 미달로 출마하지 못했다','선거에서 패배했다','경제 붕괴로 정권이 무너졌다','거리로 쫓겨났다','더는 출마할 수 없었다'];
  const NK=['조성민','민준','서연','하준','지우','도윤','서윤','예준','하은','시우','지호','수아'];const rows=[];
  for(let i=0;i<24;i++){const terms=1+Math.floor(Math.random()*4),gs='SABCDF';rows.push({id:'d'+i,nick:NK[i%NK.length]+(i>=NK.length?'2':''),score:Math.round(40+terms*60*Math.random()+terms*30),terms:terms,
    years:terms*4-Math.floor(Math.random()*2),exit:EX[Math.floor(Math.random()*EX.length)],leader:L[Math.floor(Math.random()*L.length)],bg:BGS[i%5],grades:Array.from({length:terms},()=>gs[Math.floor(Math.random()*5)]).join('/'),
    amend:terms>=3?terms-2:0,t:new Date(Date.now()-i*420000).toISOString()});}
  const by=rows.slice().sort((a,b)=>b.score-a.score),cnt=f=>rows.reduce((m,r)=>{m[f(r)]=(m[f(r)]||0)+1;return m;},{});
  return {updated:new Date().toISOString(),careers:rows.length,players:NK.length,order:by.map(r=>r.id),top:by.slice(0,30),longest:rows.slice().sort((a,b)=>b.years-a.years||b.score-a.score).slice(0,15),recent:rows.slice(0,15),
    stats:{avgTerms:2.4,reelectRate:58,amendRate:21,retireRate:25,leaders:cnt(r=>r.leader),exits:cnt(r=>r.exit),backgrounds:cnt(r=>r.bg),
      dirByTerm:[{term:1,n:24,avg:-4.2},{term:2,n:14,avg:-1.1},{term:3,n:7,avg:3.6},{term:4,n:3,avg:6.8},{term:5,n:1,avg:9.5}]}};}

t0=Date.now();load();requestAnimationFrame(tickProg);
})();
