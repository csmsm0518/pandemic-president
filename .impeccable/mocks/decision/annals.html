<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1d1b18;background:radial-gradient(100% 40% at 50% 0%,#3a2c18,#120f0b 70%)}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0;color:#c9a24a;font-size:11px;letter-spacing:.2em}
.top b{font-size:12.5px;letter-spacing:0;color:#15110c;background:linear-gradient(180deg,#f6dc8f,#c49a3e);padding:7px 13px;border-radius:999px}
h1{text-align:center;margin:12px 0 12px;font:900 28px "Noto Serif KR",serif;letter-spacing:.1em;color:#f1d589}
.difs{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.difs span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;color:#cbbd9c;border:1px solid rgba(201,162,74,.3)}
.difs .on{color:#15110c;background:#f1d589}
.roll{height:16px;margin:0 10px;border-radius:8px;background:linear-gradient(180deg,#6b5018,#c9a24a 45%,#6b5018)}
.paper{margin:0 18px;padding:18px 18px 10px;background:linear-gradient(180deg,#f6ecd4,#efe2c2);box-shadow:inset 0 0 30px rgba(120,80,20,.18)}
.first{position:relative;text-align:center;padding-bottom:14px;border-bottom:1px solid rgba(138,106,36,.35)}
.first .era{font:800 13px "Noto Serif KR",serif;letter-spacing:.4em;color:#8a6a24}
.first .nm{font:900 32px/1.2 "Noto Serif KR",serif;margin:6px 0 4px}
.first .sc{font:900 30px "Noto Serif KR",serif;color:#5a3f0c}
.first .ln{font:600 13px/1.6 "Noto Serif KR",serif;color:#4a3d2a;margin-top:6px}
.seal{position:absolute;right:-4px;top:-6px;width:58px;height:58px;border-radius:50%;border:3px double #b3261e;color:#b3261e;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);font:900 24px "Noto Serif KR",serif;line-height:1}
.seal small{font-size:8px;letter-spacing:.2em;margin-top:2px}
.ent{display:grid;grid-template-columns:52px 1fr auto;align-items:baseline;gap:8px;padding:11px 0;border-bottom:1px solid rgba(138,106,36,.22)}
.ent .era{font:800 12px "Noto Serif KR",serif;color:#8a6a24}
.ent .nm{font:800 17px "Noto Serif KR",serif}
.ent .nm em{display:block;font-style:normal;font:600 11.5px "Noto Serif KR",serif;color:#6e675c;margin-top:2px}
.ent .sc{font:900 17px "Noto Serif KR",serif;color:#5a3f0c}
.me{margin:14px 18px 0;padding:12px 14px;border:1px solid rgba(241,213,137,.45);border-radius:8px;color:#efe7d6;display:flex;justify-content:space-between;align-items:center}
.me span{font-size:12.5px;color:#cbbd9c}
.me b{font:900 20px "Noto Serif KR",serif;color:#f1d589}
</style></head><body>
<div class="top"><span>LIVE · 15초마다</span><b>게임 하러 가기</b></div>
<h1>명예의 연대기</h1>
<div class="difs"><span>쉬움</span><span class="on">보통</span><span>어려움</span><span>지옥</span><span>전체</span></div>
<div class="roll"></div>
<div class="paper">
<div class="first"><div class="era">제 1 대</div><div class="nm">백신대통령</div><div class="sc">9,842점</div><div class="ln">세 번 나라를 맡아 열다섯 해를 다스렸다. 세종과 닮았다.</div><div class="seal">S<small>임기 평가</small></div></div>
<div class="ent"><span class="era">제2대</span><span class="nm">서연<em>2선 · 처칠과 닮았다</em></span><span class="sc">8,710</span></div>
<div class="ent"><span class="era">제3대</span><span class="nm">하준<em>3선 · 아우구스투스와 닮았다</em></span><span class="sc">8,055</span></div>
<div class="ent"><span class="era">제4대</span><span class="nm">도윤<em>2선 · 만델라와 닮았다</em></span><span class="sc">7,940</span></div>
<div class="ent"><span class="era">제5대</span><span class="nm">지우<em>1선 · 리콴유와 닮았다</em></span><span class="sc">7,612</span></div>
</div>
<div class="roll"></div>
<div class="me"><span>내 커리어 · 1위까지 4,120점</span><b>23위</b></div>
</body></html>
