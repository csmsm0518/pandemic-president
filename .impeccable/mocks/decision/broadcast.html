<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#efe7d6;background:linear-gradient(180deg,#1d1812 0%,#0e0c09 60%)}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:linear-gradient(90deg,#8a6a24,#e3b94f 50%,#8a6a24);color:#15110c}
.bar b{font:900 15px "Noto Serif KR",serif;letter-spacing:.04em}
.bar .rec{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.14em;background:#15110c;color:#ff5a4f;padding:4px 9px;border-radius:3px}
.bar .rec i{width:7px;height:7px;border-radius:50%;background:#ff5a4f}
.difs{display:flex;border-bottom:1px solid rgba(201,162,74,.3)}
.difs span{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:10px 0;color:#8f7a52}
.difs .on{color:#f1d589;box-shadow:inset 0 -3px 0 #e3b94f}
.lead{position:relative;display:grid;grid-template-columns:132px 1fr;gap:12px;padding:16px 16px 12px;border-bottom:1px solid rgba(201,162,74,.2)}
.pf{width:132px;height:150px;border-radius:8px;background:radial-gradient(circle at 50% 30%,#4a3a22,#120f0b);border:1px solid rgba(201,162,74,.5);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.pf b{width:80px;height:96px;border-radius:40px 40px 8px 8px;background:#3d5a80;margin-bottom:-8px}
.k{font-size:11px;font-weight:800;letter-spacing:.2em;color:#c9a24a}
.nm{font:900 28px/1.1 "Noto Serif KR",serif;margin:4px 0 2px}
.who{font-size:12px;color:#a39a88}
.big{font:900 44px/1 "Noto Serif KR",serif;color:#fff3c4;margin-top:10px;letter-spacing:-.02em}
.big small{font-size:14px;color:#c9a24a;margin-left:2px}
.stamp{position:absolute;right:16px;top:14px;transform:rotate(-10deg);border:3px solid #ff5a4f;color:#ff5a4f;font:900 17px "Noto Serif KR",serif;letter-spacing:.2em;padding:3px 10px 4px;border-radius:4px}
.race{padding:12px 16px 4px}
.race div{display:grid;grid-template-columns:22px 64px 1fr 56px;align-items:center;gap:8px;margin-bottom:10px;font-size:13.5px}
.race i{font:800 14px "Noto Serif KR",serif;font-style:normal;color:#8f7a52}
.race s{display:block;height:16px;border-radius:2px;background:linear-gradient(90deg,#8a6a24,#e3b94f)}
.race strong{text-align:right;font:800 14px "Noto Serif KR",serif;color:#f1d589}
.me{margin:6px 16px 0;padding:12px 14px;background:rgba(255,90,79,.09);border-left:3px solid #ff5a4f;display:flex;justify-content:space-between;align-items:center}
.me span{font-size:12.5px;color:#cbbd9c;line-height:1.5}
.me b{font:900 22px "Noto Serif KR",serif;color:#ff8f86}
.cta{margin:14px 16px 0;text-align:center;font-weight:800;font-size:15px;color:#15110c;padding:14px;border-radius:10px;background:linear-gradient(180deg,#f6dc8f,#c49a3e)}
.tick{position:absolute;left:0;right:0;bottom:0;display:flex;gap:0;background:#15110c;border-top:1px solid rgba(201,162,74,.4);font-size:12.5px;white-space:nowrap}
.tick b{background:#ff5a4f;color:#fff;padding:10px 12px;font-size:12px;letter-spacing:.1em}
.tick span{padding:10px 12px;color:#efe7d6}
</style></head><body>
<div class="bar"><b>명예의 전당 개표 상황</b><span class="rec"><i></i>실시간</span></div>
<div class="difs"><span>쉬움</span><span class="on">보통</span><span>어려움</span><span>지옥</span><span>전체</span></div>
<div class="lead"><div class="pf"><b></b></div><div><div class="k">1위 · 보통</div><div class="nm">백신대통령</div><div class="who">3선 · 15년 · 닮은 지도자 세종</div><div class="big">9,842<small>점</small></div></div><div class="stamp">당선</div></div>
<div class="race">
<div><i>2</i><span>서연</span><s style="width:88%"></s><strong>8,710</strong></div>
<div><i>3</i><span>하준</span><s style="width:82%"></s><strong>8,055</strong></div>
<div><i>4</i><span>도윤</span><s style="width:80%"></s><strong>7,940</strong></div>
<div><i>5</i><span>지우</span><s style="width:77%"></s><strong>7,612</strong></div>
<div><i>6</i><span>예준</span><s style="width:74%"></s><strong>7,301</strong></div></div>
<div class="me"><span>내 커리어 · 1위까지 4,120점</span><b>23위</b></div>
<div class="cta">나도 출마하기</div>
<div class="tick"><b>속보</b><span>방금 · 민준 6,410점 (어려움) · 지우 2선 달성 · 서윤 하야</span></div>
</body></html>
