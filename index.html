<!DOCTYPE html>

<title>팬데믹 대통령</title>
<style>
:root{
  --bg:#101418;--surface-0:#171c22;--surface-1:#1d232b;--surface-2:#1a2027;
  --border:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.22);
  --text-primary:#e9ecef;--text-secondary:#a7afb8;--text-muted:#6b737d;
  --text-danger:#f0605f;--text-success:#3fc38f;--text-warning:#eda100;
  --radius:8px;
  --font-ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  --font-voice:"Noto Serif KR","Apple Myungjo",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{max-width:440px;margin:0 auto;padding:22px 16px 48px;min-height:100vh}
button{font:inherit;color:var(--text-primary);background:var(--surface-0);border:1px solid var(--border-strong);border-radius:10px;padding:10px 14px;cursor:pointer;line-height:1.4;transition:background .15s,transform .08s}
button:hover{background:var(--surface-1)}
button:active{transform:scale(.985)}
button:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible{outline:2px solid #6250d6;outline-offset:2px}
em{font-style:normal;font-weight:600;color:var(--text-danger)}
canvas{display:block}
@keyframes fxL{0%{opacity:0;transform:scale(.6)}22%{opacity:1;transform:scale(1.08)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.02)}}
@keyframes fxT{0%{opacity:0}28%{opacity:1}100%{opacity:0}}
@keyframes shk{0%,100%{transform:translateX(0)}12%{transform:translateX(-8px)}28%{transform:translateX(7px)}44%{transform:translateX(-5px)}62%{transform:translateX(4px)}82%{transform:translateX(-2px)}}
@keyframes fdIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes wIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@keyframes optIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(2) rotate(-12deg)}55%{opacity:1;transform:scale(.92) rotate(-5deg)}100%{transform:scale(1) rotate(-5deg)}}
@keyframes reelIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<div id="app">

    <div style="font-size:34px;font-weight:600;line-height:1.12;margin-bottom:16px">팬데믹<br>대통령</div>
    <div style="font-size:14px;color:var(--text-secondary);line-height:1.8;margin-bottom:10px">취임 3주 만에 <em>첫 확진자</em>가 나왔다. 임기 4년이 그대로 팬데믹 4년이 된다.</div>
    <div style="font-size:13px;color:var(--text-muted);line-height:1.8;margin-bottom:24px">감염은 지수적으로 번지고 사라지지 않는다. 권한을 쥐면 유착이 자라고, 지지율은 가만히 두면 떨어진다. 볼 수 있는 것은 <em>인구 지도와 참모의 귓속말</em>뿐이다.</div>
    <label for="nick" style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px">닉네임 (최대 20자, 비우면 익명)</label>
    <input id="nick" maxlength="20" placeholder="익명" autocomplete="off" style="width:100%;box-sizing:border-box;padding:12px;font-size:15px;margin-bottom:10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary)">
    <div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">※ 플레이 결과가 기록됩니다 (닉네임·선택·엔딩·점수·플레이 시간)</div>
    <button id="go" style="width:100%;padding:15px;font-size:15px">▶&nbsp; 시작 (소리 켜짐)</button>
    <div style="font-size:11px;color:var(--text-muted);margin-top:12px;text-align:center">기록은 이 브라우저에 저장된다</div>
  </div>
</div>

const AU={ac:null,m:null,on:true,filt:null,dg:null,hb:0};
function aInit(){if(AU.ac){if(AU.ac.state==='suspended')AU.ac.resume();return;}
  try{AU.ac=new (window.AudioContext||window.webkitAudioContext)();AU.m=AU.ac.createGain();AU.m.gain.value=AU.on?.7:0;AU.m.connect(AU.ac.destination);
  const o1=AU.ac.createOscillator(),o2=AU.ac.createOscillator();o1.type='sine';o2.type='triangle';o1.frequency.value=55;o2.frequency.value=82.4;o2.detune.value=-7;
  AU.filt=AU.ac.createBiquadFilter();AU.filt.type='lowpass';AU.filt.frequency.value=160;AU.dg=AU.ac.createGain();AU.dg.gain.value=0;
  o1.connect(AU.filt);o2.connect(AU.filt);AU.filt.connect(AU.dg);AU.dg.connect(AU.m);o1.start();o2.start();
  setInterval(hbTick,90);}catch(e){}}
function tone(f,type,dur,vol,when,slide){if(!AU.ac)return;when=when||0;const t0=AU.ac.currentTime+when,o=AU.ac.createOscillator(),g=AU.ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(AU.m);o.start(t0);o.stop(t0+dur+.05);}
function noise(dur,vol,when,cut){if(!AU.ac)return;when=when||0;const t0=AU.ac.currentTime+when,n=Math.floor(AU.ac.sampleRate*dur),b=AU.ac.createBuffer(1,n,AU.ac.sampleRate),d=b.getChannelData(0);
  for(let k=0;k<n;k++)d[k]=Math.random()*2-1;const s=AU.ac.createBufferSource();s.buffer=b;const f=AU.ac.createBiquadFilter();f.type='lowpass';f.frequency.value=cut||800;
  const g=AU.ac.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);s.connect(f);f.connect(g);g.connect(AU.m);s.start(t0);}

/* ---------- MAP ---------- */
const MAP={d:[],nb:[],inf:new Set(),dead:new Set(),tgt:10,dtgt:0,last:0,run:false};
(function(){const C=30,Rw=11;for(let r=0;r<Rw;r++)for(let c=0;c<C;c++){MAP.d.push({x:(c+.5)/C+(Math.random()-.5)*.02,y:(r+.5)/Rw+(Math.random()-.5)*.05,ph:Math.random()*6.28});}
 for(let r=0;r<Rw;r++)for(let c=0;c<C;c++){const a=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&rr<Rw&&cc>=0&&cc<C)a.push(rr*C+cc);}MAP.nb.push(a);}})();
function mapReset(){MAP.inf.clear();MAP.dead.clear();MAP.tgt=INIT.i;MAP.dtgt=0;}
function mapUpdate(){const N=MAP.d.length,want=Math.round(MAP.tgt/100*N);
  for(let s=0;s<4;s++){if(MAP.inf.size<want){let done=false;if(MAP.inf.size){const arr=[...MAP.inf],src=arr[Math.floor(Math.random()*arr.length)];const nb=MAP.nb[src].filter(j=>!MAP.inf.has(j)&&!MAP.dead.has(j));if(nb.length){MAP.inf.add(nb[Math.floor(Math.random()*nb.length)]);done=true;}}
    if(!done){const free=[];for(let k=0;k<N;k++)if(!MAP.inf.has(k)&&!MAP.dead.has(k))free.push(k);if(free.length)MAP.inf.add(free[Math.floor(Math.random()*free.length)]);}}
   else if(MAP.inf.size>want){const arr=[...MAP.inf];MAP.inf.delete(arr[Math.floor(Math.random()*arr.length)]);}else break;}
  const wd=Math.min(Math.round(N*.4),Math.round(MAP.dtgt/4));
  if(MAP.dead.size<wd){let cand=[...MAP.inf];if(!cand.length){cand=[];for(let k=0;k<N;k++)if(!MAP.dead.has(k))cand.push(k);}if(cand.length){const k=cand[Math.floor(Math.random()*cand.length)];MAP.inf.delete(k);MAP.dead.add(k);}}}
function mapDraw(){const c=document.getElementById('map');if(!c)return;const w=c.clientWidth||320,h=118;
  if(c.width!==Math.round(w*DPR)){c.width=Math.round(w*DPR);c.height=Math.round(h*DPR);}
  const x=c.getContext('2d');x.setTransform(DPR,0,0,DPR,0,0);x.clearRect(0,0,w,h);const t=performance.now()/1000;
  for(let k=0;k<MAP.d.length;k++){const d=MAP.d[k],px=d.x*w,py=d.y*h;
    if(MAP.dead.has(k)){x.fillStyle='rgba(70,52,56,.95)';x.beginPath();x.arc(px,py,1.5,0,6.283);x.fill();}
    else if(MAP.inf.has(k)){const p=.7+.3*Math.sin(t*4.2+d.ph);x.shadowColor='#e34948';x.shadowBlur=8;x.fillStyle='rgba(227,73,72,'+p+')';x.beginPath();x.arc(px,py,2.5,0,6.283);x.fill();x.shadowBlur=0;}
    else{x.fillStyle='rgba(160,168,178,.32)';x.beginPath();x.arc(px,py,1.7,0,6.283);x.fill();}}}
function mapLoop(){if(!MAP.run)return;const t=performance.now();if(t-MAP.last>70){MAP.last=t;mapUpdate();}mapDraw();requestAnimationFrame(mapLoop);}
function mapStart(){if(MAP.run)return;MAP.run=true;requestAnimationFrame(mapLoop);}

  document.getElementById('snd').onclick=toggleSound;

  const wp=document.getElementById('wipe');if(wp)wp.onclick=()=>{if(confirm('최고 기록과 엔딩 도감을 모두 지울까?')){MEM.best=0;MEM.runs=0;MEM.ends={};msave();home();}};
}

function start(){
  LOG=[];T0=Date.now();
  S=Object.assign({turn:0,quit:0},INIT);
  MOD=pk(MODS);tok=2;streak=0;snap=null;peakI=S.i;hist=[];
  const q=PERKS[perk];if(q.f)q.f(S);if(q.t)tok+=q.t;
  base=S.chk+S.trn+S.saf;pool=EV.slice();last=null;tally=[0,0,0,0];chron=[];prev=null;queue=[];deaths=0;yd=0;
  mapReset();mapStart();setAmb(S.i);
  cur={t:'첫 확진자',d:'취임 3주째. 해외 유입 <em>첫 확진자</em>가 확인됐다. 상황실이 처음으로 소집됐고, 모두가 대통령의 입을 보고 있다.',o:[
   ['위기경보를 최고 단계로 즉시 격상한다',{p:11,i:-11,e:-7,a:5},'과잉대응이라는 비판이 하루 만에 나왔다. 3주 뒤에는 아무도 그 말을 하지 않았다.'],
   ['상황을 지켜보며 단계적으로 대응한다',{i:5,e:4,a:4,chk:5},'신중했다. 그사이 지역사회 전파가 시작됐다.'],
   ['질병관리청에 전권을 위임한다',{trn:11,chk:9,p:-7,i:-5},'대통령이 한 발 물러섰고 전문가가 마이크를 잡았다.']]};
  pickAdv();ev();
}
function pickAdv(){for(const a of ADV){if(a.c(S)){adv={who:a.who,l:pk(a.l)};return;}}}

function hud(){const y=Math.floor(S.turn/PY)+1,v=Math.round(S.i);
  const lb=v<20?'안정':v<40?'주의':v<60?'경계':v<80?'심각':'대유행';
  const c=v<20?'#3fc38f':v<40?'#eda100':v<60?'#eb6834':'#f0605f';
  let seg='';for(let k=0;k<YRS*PY;k++){const col=k<hist.length?TIER[hist[k]].bd:(k===S.turn?c:'var(--surface-1)');seg+='<span style="flex:1;height:4px;border-radius:2px;background:'+col+';'+(k===S.turn&&k>=hist.length?'animation:pls 1.2s infinite;':'')+(k%PY===PY-1&&k<YRS*PY-1?'margin-right:4px;':'')+'"></span>';}
  const coins=Array.from({length:tok},()=>'<span style="color:#8b7cf6">●</span>').join(' ');
  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
  '<span style="font-size:12px;color:var(--text-muted)">임기 '+y+'년차 '+(S.turn%PY+1)+'/'+PY+' <span style="margin-left:6px;opacity:.7">'+DIFF[dif].n+' · '+MOD.n+'</span></span>'+
  '<button id="snd" style="width:32px;height:28px;padding:0;display:flex;align-items:center;justify-content:center" aria-label="소리 켜기 끄기">'+(AU.on?ICO.vol:ICO.mute)+'</button></div>'+
  '<div style="display:flex;gap:2px;margin-bottom:10px">'+seg+'</div>'+
  '<div style="position:relative;border-radius:10px;overflow:hidden;background:var(--surface-1);margin-bottom:10px"><canvas id="map" style="width:100%;height:118px"></canvas>'+
  '<div style="position:absolute;left:10px;bottom:7px;font-size:11px;color:var(--text-secondary)">확산 지수 <span style="font-weight:600;color:'+c+'">'+v+'</span> <span style="color:'+c+'">'+lb+'</span></div>'+
  '<div style="position:absolute;right:10px;top:7px;font-size:10px;color:var(--text-muted);letter-spacing:1px">인구 지도</div></div>'+
  '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11px;color:var(--text-muted)">'+
  '<span>개입 '+(tok?coins:'<span style="opacity:.5">없음</span>')+'</span>'+
  (streak>=2?'<span style="color:#3fc38f;font-weight:600;animation:pls 1.6s infinite">연속 '+streak+(streak>=4?' 모멘텀':'')+'</span>':'<span></span>')+'</div>'+
  '<div style="overflow:hidden;white-space:nowrap;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px 0;margin-bottom:14px"><span style="display:inline-block;padding-left:100%;animation:tk 26s linear infinite;font-size:11px;color:var(--text-muted)"><span style="color:var(--text-danger);font-weight:600">속보</span>&nbsp; '+headlines()+'</span></div>';}
function vign(){return '<div style="position:absolute;inset:-6px;pointer-events:none;border-radius:12px;background:radial-gradient(ellipse at center,transparent 55%,rgba(227,73,72,'+(S.i/100*.3).toFixed(3)+') 100%)"></div>';}
function bindSnd(){const b=document.getElementById('snd');if(b)b.onclick=toggleSound;}

function ev(){
  R.innerHTML='<div id="wrap" style="position:relative">'+vign()+hud()+
  '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:15px 16px;margin-bottom:12px;animation:fdIn .35s ease-out">'+
  '<div style="font-size:17px;font-weight:600;margin-bottom:8px">'+cur.t+'</div>'+
  '<div style="font-size:14px;color:var(--text-secondary);line-height:1.75">'+cur.d+'</div></div>'+
  '<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;padding:0 4px;animation:fdIn .5s ease-out">'+
  '<span style="width:28px;height:28px;border-radius:50%;background:var(--surface-1);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:var(--text-muted)">참</span>'+
  '<div style="font-size:13px;line-height:1.6"><span style="color:var(--text-muted)">'+adv.who+'</span> <span style="color:var(--text-secondary);font-family:var(--font-voice)">"'+adv.l+'"</span></div></div>'+
  '<div id="gOpts" style="display:flex;flex-direction:column;gap:8px"></div>'+

    b.style.cssText='text-align:left;padding:12px 13px;display:block;font-size:14px;line-height:1.5;opacity:0;animation:optIn .35s ease-out forwards;animation-delay:'+(120+k*90)+'ms';
    b.textContent=o[0];b.onclick=()=>choose(k);ob.appendChild(b);});
  bindSnd();}

function reel(t,cb){const f=document.getElementById('fx'),w=document.getElementById('wrap');
  f.innerHTML='<div style="position:relative;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:16px;padding:16px 34px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.45);animation:reelIn .2s ease-out"><div style="font-size:10px;letter-spacing:3px;color:var(--text-muted);margin-bottom:6px">판정</div><div id="rl" style="font-size:26px;font-weight:600;letter-spacing:5px;min-width:130px"></div></div>';
  const rl=document.getElementById('rl'),del=[50,50,55,60,70,80,95,115,140,175,220];let k=0;
  (function step(){if(k<del.length){const rt=k===del.length-1?t:Math.floor(Math.random()*4);rl.textContent=TIER[rt].n;rl.style.color=TIER[rt].fg;SFX.tick(k);k++;setTimeout(step,del[k-1]);}
   else{setTimeout(()=>{const T=TIER[t];SFX.tier(t);vib(t===3?[70,50,90]:t===2?45:t===0?[20,30,20]:0);
     f.innerHTML='<div style="position:absolute;inset:0;background:'+T.tint+';border-radius:12px;animation:fxT '+T.ms+'ms ease-out forwards"></div>'+
     '<div style="position:relative;font-size:'+T.fs+'px;font-weight:600;letter-spacing:5px;color:'+T.fg+';animation:fxL '+T.ms+'ms ease-out forwards;text-shadow:0 0 24px '+T.tint+'">'+T.n+'</div>';
     if(t>=2)w.style.animation='shk '+(t===3?560:360)+'ms ease-out';
     setTimeout(()=>{w.style.animation='';f.innerHTML='';cb();},T.ms);},120);}})();}

function takeSnap(){snap={S:Object.assign({},S),deaths:deaths,yd:yd,q:queue.slice(),cl:chron.length,hl:hist.length,st:streak,pi:peakI};}
function useSnap(){S=Object.assign({},snap.S);deaths=snap.deaths;yd=snap.yd;queue=snap.q.slice();chron.length=snap.cl;hist.length=snap.hl;streak=snap.st;peakI=snap.pi;}

function choose(k){SFX.click();document.querySelectorAll('#gOpts button').forEach(b=>b.disabled=true);
  takeSnap();lastO=cur.o[k];LOG.push(cur.o[k][0]);const t=roll();lastT=t;tally[t]++;reel(t,()=>resolve(lastO,t));}
function reroll(){if(tok<=0)return;SFX.coin();tok--;useSnap();tally[lastT]--;const t2=roll();lastT=t2;tally[t2]++;
  R.innerHTML='<div id="wrap" style="position:relative;min-height:260px">'+vign()+hud()+
  '<div style="font-size:13px;color:var(--text-muted);text-align:center;margin-top:24px">운명의 주사위를 다시 굴린다</div>'+
  '<div id="fx" style="position:absolute;inset:-6px;display:flex;align-items:center;justify-content:center;pointer-events:none"></div></div>';
  bindSnd();reel(t2,()=>resolve(lastO,t2));}

function resolve(o,t){const e=o[1],ch=o[3];
  chron.push({t:t,n:cur.t});hist.push(t);streak=(t<=1)?streak+1:0;
  if(e.X==='crush'){const able=(S.p>52&&S.a>32);
    if(t===3||(!able&&t!==0))return gate('ousted');
    apply({u:-30,a:-22,c:11,p:6},1);
    last={t:t,x:'공권력이 광장을 비웠다. 질서는 돌아왔고 <em>그 장면이 정부의 얼굴</em>이 됐다. '+pk(TIER[t].l)};}
  else if(e.X==='quit'){S.quit=1;return end('quit');}
  else{apply(e,0,t);last={t:t,x:o[2]+' '+pk(TIER[t].l)};
    if(t===3){S.a=cl(S.a-4);S.u=cl(S.u+4);}
    if(ch){const id=t<=1?ch.ok:ch.bad;if(id&&CH[id])queue.push(CH[id]);}}
  tick();MAP.tgt=S.i;MAP.dtgt=deaths;setAmb(S.i);
  if(S.m<=3&&S.i>=75)return gate('medfail');
  if(S.e<=4)return gate('ecofail');
  if(S.a<=3&&S.u>=68)return gate('ousted');
  res();}

function gate(kind){if(tok<=0)return end(kind);SFX.gate();vib([120,80,160]);
  R.innerHTML='<div style="animation:fdIn .5s ease-out;position:relative"><div style="position:absolute;inset:-6px;pointer-events:none;border-radius:12px;background:radial-gradient(ellipse at center,transparent 40%,rgba(227,73,72,.35) 100%)"></div>'+
  '<div style="font-size:12px;color:var(--text-danger);letter-spacing:3px;margin-bottom:8px;animation:pls 1.4s infinite">정권의 마지막 순간</div>'+
  '<div style="font-size:24px;font-weight:600;margin-bottom:12px">이대로 끝인가?</div>'+
  '<div style="font-size:14px;color:var(--text-secondary);line-height:1.8;margin-bottom:22px">역사가 이 임기의 마지막 문장을 쓰기 직전이다. 아직 <em>운명에 개입할 기회</em>가 '+tok+'번 남아 있다. 다시 굴려도 같은 결과가 나올 수 있다.</div>'+
  '<button id="rr" style="width:100%;margin-bottom:8px;padding:13px"><span style="color:#8b7cf6">●</span>&nbsp; 운명에 개입한다 (남은 '+tok+'회)</button>'+
  '<button id="ac" style="width:100%;font-size:13px;color:var(--text-secondary)">운명을 받아들인다</button></div>';
  document.getElementById('rr').onclick=reroll;document.getElementById('ac').onclick=()=>{SFX.click();end(kind);};}

function apply(e,raw,t){const T=TIER[t===undefined?1:t],mom=streak>=4?1.1:1;
  for(const k in e){if(k==='X')continue;const v=e[k],good=BAD[k]?v<0:v>0;S[k]=cl(S[k]+(raw?v:v*EVS*(good?T.g*mom:T.b)));}}

function tick(){const te=MOD.te||1,D=DIFF[dif],yr=Math.floor(S.turn/PY);
  let r=.17+S.u/500+(MOD.ip||0)+yr*.022+D.r-S.p/420-(S.trn*te)/900-S.m/1100;r=Math.max(-.11,Math.min(.34,r));
  S.i=cl(Math.max(D.fl,S.i+S.i*r*(1-S.i/100)));if(S.i>peakI)peakI=S.i;
  S.m=cl(S.m-Math.max(0,S.i-50)/13+S.e/150+.2);
  const dd=(S.i/28)*(1+Math.max(0,50-S.m)/42)*(MOD.dd||1)*D.dd;deaths+=dd;yd+=dd;
  S.e=cl(S.e-S.i/72-S.p/135+S.saf/210+.48+(MOD.ep||0)-S.c/62);
  S.c=cl(S.c+.22+Math.max(0,S.p-34)/22*(1-(S.trn*te)/150)-(S.trn*te)/320);
  S.u=cl(S.u+S.i/95+Math.max(0,S.p-45)/47+Math.max(0,45-S.e)/58-S.saf/230-.32+(MOD.up||0));
  S.a=cl(S.a-.28-D.ad-S.i/85-Math.max(0,48-S.e)/62-S.u/130-S.c/160+Math.max(0,S.e-55)/95+(MOD.ap||0));
  S.p=cl(S.p-S.chk/100*(S.p/115));
  S.chk=cl(S.chk-.12-Math.max(0,S.p-45)/70);S.trn=cl(S.trn-.1-S.c/260);S.saf=cl(S.saf-.08);}

function res(){const T=TIER[last.t],wc=last.x.split(' ').length;
  R.innerHTML='<div id="wrap" style="position:relative">'+vign()+hud()+
  '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span style="font-size:11px;padding:3px 10px;border-radius:var(--radius);background:'+T.tint+';color:'+T.fg+';font-weight:600;letter-spacing:2px">'+T.n+'</span><span style="font-size:11px;color:var(--text-muted)">'+cur.t+'</span></div>'+
  '<div style="border-left:3px solid '+T.bd+';padding:4px 0 4px 14px;margin-bottom:20px"><div style="font-size:15px;line-height:1.95">'+words(last.x,80)+'</div></div>'+
  '<button id="nx" style="width:100%;margin-bottom:8px;padding:13px;opacity:0;animation:fdIn .4s ease-out forwards;animation-delay:'+Math.min(1400,wc*42+200)+'ms">계속</button>'+
  (tok>0&&last.t>=2?'<button id="rr" style="width:100%;font-size:13px;color:#8b7cf6;opacity:0;animation:fdIn .4s ease-out forwards;animation-delay:'+Math.min(1600,wc*42+400)+'ms">● 운명에 개입한다 (남은 '+tok+'회)</button>':'')+'</div>';
  bindSnd();
  document.getElementById('nx').onclick=()=>{SFX.click();S.turn++;if(S.turn>=YRS*PY)return end('done');if(S.turn%PY===0)return report();next();pickAdv();ev();};
  const r=document.getElementById('rr');if(r)r.onclick=reroll;}

function next(){if(queue.length){cur=queue.shift();return;}
  if(S.u>44&&Math.random()<Math.pow(S.u/100,2)*(.35+S.c/110)*(1-S.chk/180)*.22){cur=(S.chk>=48)?IMP:UPR;return;}
  const y=Math.floor(S.turn/PY)+1;let ok=pool.filter(e=>(e.y===0||e.y===y)&&(!e.w||e.w(S)));
  if(!ok.length){pool=EV.slice();ok=pool.filter(e=>e.y===0||e.y===y);}
  cur=pk(ok);pool.splice(pool.indexOf(cur),1);}

function score(){const ins=Math.max(0,(S.chk+S.trn+S.saf)-base),ds=cl(100-deaths/2.2);
  return S.a*.26+ds*.27+S.e*.19+(100-S.c)*.11+Math.min(100,ins*1.25)*.17;}
function rline(a,b,k){return '<div style="padding:9px 0;border-bottom:1px solid var(--border);opacity:0;animation:fdIn .4s ease-out forwards;animation-delay:'+(k*110)+'ms"><div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">'+a+'</div><div style="font-size:14px;line-height:1.7">'+b+'</div></div>';}
function body(){const ins=(S.chk+S.trn+S.saf)-base;
  const iv=ins>=24?'이 정부가 만든 <em>제도와 법이 자리를 잡았습니다</em>. 다음 정부도 이 틀 안에서 일하게 됩니다.':ins>=10?'몇 가지 새 제도가 생겼습니다. 아직 뿌리내리지는 않았습니다.':ins<=-10?'<em>기존의 견제 장치들이 하나둘 무력화</em>됐습니다.':'제도는 취임 때와 크게 다르지 않습니다.';
  return rline('방역 상황',RP.i[bd(S.i)],0)+rline('인명 피해',RP.dth[db(yd)],1)+rline('의료 역량',RP.m[bd(S.m)],2)+rline('여론',RP.a[bd(S.a)],3)+rline('경제',RP.e[bd(S.e)],4)+rline('사회 갈등',RP.u[bd(S.u)],5)+rline('행정 권한',RP.p[bd(S.p)],6)+rline('조달과 유착',RP.c[bd(S.c)],7)+rline('제도',iv,8);}

function report(){SFX.report();const y=S.turn/PY,sc=score();let tr='';
  if(prev!==null){const d=sc-prev;tr=d>3?'전체적으로 작년보다 나아지고 있습니다.':d<-3?'솔직히 말씀드리면, <em>작년보다 나빠지고 있습니다</em>.':'작년과 크게 다르지 않습니다.';}
  prev=sc;
  const cr=chron.map(c=>'<span style="display:inline-block;font-size:11px;padding:3px 9px;border-radius:var(--radius);margin:0 5px 5px 0;background:var(--surface-1);border-left:2px solid '+TIER[c.t].bd+'">'+c.n+'</span>').join('');
  R.innerHTML='<div style="position:relative">'+
   '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px"><span style="font-size:11px;color:var(--text-muted);letter-spacing:2px">임기 '+y+'년차 연말</span><span style="font-size:11px;color:var(--text-muted)">'+DIFF[dif].n+' · '+MOD.n+'</span></div>'+
   '<div style="font-size:20px;font-weight:600;margin-bottom:10px">참모진 보고</div>'+
   '<div style="position:relative;border-radius:10px;overflow:hidden;background:var(--surface-1);margin-bottom:12px"><canvas id="map" style="width:100%;height:118px"></canvas><div style="position:absolute;right:10px;top:7px;font-size:10px;color:var(--text-muted);letter-spacing:1px">연말 인구 지도</div></div>'+
   '<div style="font-size:13px;color:var(--text-secondary);line-height:1.7;margin-bottom:12px;font-family:var(--font-voice)">대통령님, 올 한 해를 정리해 보고드립니다.</div>'+
   '<div style="margin-bottom:16px">'+body()+'</div>'+
   (tr?'<div style="background:var(--surface-1);border-radius:var(--radius);padding:11px 13px;font-size:13px;line-height:1.7;margin-bottom:16px;opacity:0;animation:fdIn .4s ease-out forwards;animation-delay:1000ms">'+tr+'</div>':'')+
   '<div style="font-size:11px;color:var(--text-muted);margin-bottom:7px">그해의 결정들</div><div style="margin-bottom:18px">'+cr+'</div>'+
   '<button id="nx" style="width:100%;padding:13px">'+(y+1)+'년차로</button></div>';
  chron=[];yd=0;document.getElementById('nx').onclick=()=>{SFX.click();next();pickAdv();ev();};}

const ENDS={ousted:['거리로 쫓겨난 대통령','여론과 광장이 임기를 먼저 끝냈다. 방역의 성패를 따지기도 전에 정부가 사라졌다.','#f0605f'],
medfail:['의료 붕괴','병상도 인력도 남지 않았다. 이 시기의 사망자 수는 이후 어떤 통계에서도 정상으로 분류되지 않는다.','#f0605f'],
ecofail:['무너진 경제','방역은 어떻게든 했다. 사람들이 돌아갈 일자리가 남지 않았을 뿐이다.','#eb6834']};

function countUp(el,to,ms){const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/ms);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);})(t0);}
function copyText(t,btn){const orig=btn.textContent,done=()=>{btn.textContent='복사됨';setTimeout(()=>btn.textContent=orig,1600);};
  function fb(){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);done();}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb();}

function end(kind){
  const ins=Math.max(0,(S.chk+S.trn+S.saf)-base),y=Math.max(1,Math.ceil(S.turn/PY));
  let sc=score();if(S.quit)sc-=6;const auth=(S.p>=60&&S.chk<=44),g=grade(sc);
  let eid,ti,ds,col;
  if(ENDS[kind]){eid=kind;ti=ENDS[kind][0];ds=ENDS[kind][1];col=ENDS[kind][2];}
  else if(S.quit){eid='quit';ti='임기를 채우지 못한 대통령';ds='스스로 내려왔다. 그 판단이 옳았는지는 오래 논쟁거리로 남는다.';col='#8a9099';}
  else if(S.c>=60&&S.a>=48){eid='shadow';ti='그림자 정부';ds='유착은 극에 달했는데 지지율은 무너지지 않았다. <em>부패한 정부가 사랑받을 수 있다</em>는 가장 불편한 증명이 됐다.';col='#f0605f';}
  else if(deaths<34&&S.e>=60&&peakI<=45){eid='kmyth';ti='기적의 방역';ds='사람도 지키고 경제도 지켰다. 다른 나라들은 <em>둘 중 하나는 포기해야 했다</em>.';col='#3fc38f';}
  else if(S.trn>=86&&ins>=20){eid='science';ti='과학이 이겼다';ds='이 정부의 무기는 권한이 아니라 <em>공개된 데이터</em>였다. 사람들은 명령이 아니라 근거를 따라 움직였다.';col='#4a8fe0';}
  else if(S.a>=58&&S.e>=58&&S.m>=58&&S.i<=25&&S.c<=28&&S.u<=35){eid='balance';ti='완벽한 균형';ds='방역, 경제, 의료, 여론, 청렴. <em>무엇 하나 버리지 않았다</em>. 교과서는 이런 사례를 오래 찾고 있었다.';col='#8b7cf6';}
  else if(auth&&sc<70){eid='auth';ti='권위주의로 돌아선 대통령';ds='위기를 이유로 얻은 권한을 끝내 돌려주지 않았다. <em>다음 대통령도 그 권한을 쓴다.</em>';col='#f0605f';}
  else if(ins>=28&&S.a>=45){eid='inst';ti='제도를 남긴 대통령';ds='개인의 판단이 아니라 <em>구조를 바꿨다</em>. 다음 팬데믹에 이 나라가 덜 죽는다면 그건 이 임기 덕분이다.';col='#8b7cf6';}
  else if(sc>=80){eid='legend';ti='역사에 남을 대응';ds='세계가 이 나라의 사례를 인용했다. 그리고 실제로 사람이 덜 죽었다.';col='#3fc38f';}
  else if(sc>=66){eid='reelect';ti='재선에 성공한 대통령';ds='완벽하지 않았지만 국민은 한 번 더 맡기기로 했다.';col='#3fc38f';}
  else if(sc>=52){eid='modest';ti='무난히 임기를 마친 대통령';ds='큰 실패도 큰 성취도 없었다. 팬데믹 시기 대통령에게 이것이 나쁜 성적인지는 애매하다.';col='#4a8fe0';}
  else if(sc>=36){eid='judged';ti='심판받은 대통령';ds='정권은 교체됐다. 사람들은 이 4년을 되도록 이야기하지 않으려 한다.';col='#8a9099';}
  else{eid='failfp';ti='실패한 방역';ds='막을 수 있었던 죽음이 너무 많았다. 그것이 이 임기에 대한 유일한 요약이다.';col='#f0605f';}
  sendLog(ti,sc);
  const newEnd=!MEM.ends[eid],newBest=sc>MEM.best;MEM.ends[eid]=1;MEM.runs++;if(newBest)MEM.best=sc;msave();
  const got=Object.keys(MEM.ends).length;setAmb(8);
  const row=(a,b)=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text-secondary)">'+a+'</span><span style="font-weight:600">'+b+'</span></div>';
  const summary='팬데믹 대통령 결과\n난이도 '+DIFF[dif].n+' / 시대 조건 '+MOD.n+'\n엔딩: '+ti+' ('+g+'등급, '+Math.round(sc)+'점)\n지지율 '+Math.round(S.a)+', 최고 확산 지수 '+Math.round(peakI)+', 인명피해 지수 '+Math.round(deaths)+', 의료 '+Math.round(S.m)+', 경제 '+Math.round(S.e)+', 행정권한 '+Math.round(S.p)+', 유착 '+Math.round(S.c)+', 사회갈등 '+Math.round(S.u)+', 제도 변화 +'+Math.round(ins)+'\n주사위: 대성공 '+tally[0]+' 성공 '+tally[1]+' 실패 '+tally[2]+' 대실패 '+tally[3];
  R.innerHTML='<div style="position:relative">'+
   '<div style="font-size:11px;color:var(--text-muted);letter-spacing:2px;margin-bottom:8px">임기 '+y+'년 최종 보고 · '+DIFF[dif].n+' · '+MOD.n+'</div>'+
   '<div style="position:relative;border-radius:10px;overflow:hidden;background:var(--surface-1);margin-bottom:14px"><canvas id="map" style="width:100%;height:118px"></canvas>'+
   '<div style="position:absolute;right:12px;top:10px;font-size:46px;font-weight:700;color:'+GCOL[g]+';animation:stamp .7s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:.5s;opacity:0;text-shadow:0 2px 14px rgba(0,0,0,.5)">'+g+'</div>'+
   '<div style="position:absolute;left:10px;bottom:7px;font-size:10px;color:var(--text-muted);letter-spacing:1px">임기 종료 시점의 나라</div></div>'+
   '<div style="font-size:24px;font-weight:600;color:'+col+';line-height:1.3;margin-bottom:8px;animation:fdIn .5s ease-out">'+ti+'</div>'+
   (newEnd?'<span style="display:inline-block;background:var(--surface-1);border-left:2px solid #6250d6;font-size:12px;padding:4px 10px;border-radius:var(--radius);margin:0 6px 8px 0">도감에 새 엔딩 등록 '+got+'/'+ENDC.length+'</span>':'')+
   (newBest?'<span style="display:inline-block;background:var(--surface-1);border-left:2px solid #1baf7a;font-size:12px;padding:4px 10px;border-radius:var(--radius);margin-bottom:8px">최고 기록 갱신</span>':'')+
   '<div style="font-size:14px;color:var(--text-secondary);line-height:1.8;margin:6px 0 18px">'+words(ds,600)+'</div>'+
   '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:13px;color:var(--text-secondary)">종합 점수</span><span><span id="scn" style="font-size:34px;font-weight:600">0</span><span style="font-size:13px;color:var(--text-muted)"> / 100</span></span></div>'+
   '<div style="margin-bottom:18px">'+body()+'</div>'+
   '<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">이제야 숫자를 보여준다</div>'+
   '<div style="background:var(--surface-1);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px">'+
   row('지지율',Math.round(S.a))+row('확산 지수 (최고)',Math.round(S.i)+' ('+Math.round(peakI)+')')+row('누적 인명 피해 지수',Math.round(deaths))+row('의료 역량',Math.round(S.m))+row('경제',Math.round(S.e))+row('행정 권한',Math.round(S.p))+row('유착',Math.round(S.c))+row('사회 갈등',Math.round(S.u))+row('제도 변화','+'+Math.round(ins))+'</div>'+
   '<div style="background:var(--surface-1);border-radius:var(--radius);padding:11px 13px;margin-bottom:14px;font-size:13px;color:var(--text-secondary)">주사위: 대성공 '+tally[0]+' / 성공 '+tally[1]+' / 실패 '+tally[2]+' / 대실패 '+tally[3]+' / 남은 개입 '+tok+'회</div>'+
   '<button id="again" style="width:100%;margin-bottom:8px;padding:13px">한 번 더 취임한다</button>'+
   '<button id="cp" style="width:100%;font-size:13px">결과 복사하기</button></div>';
  setTimeout(()=>{SFX.grade(g);const el=document.getElementById('scn');if(el)countUp(el,Math.round(sc),1400);},500);
  document.getElementById('again').onclick=()=>{SFX.click();home();};
  document.getElementById('cp').onclick=function(){copyText(summary,this);};}

const SHEET_URL='https://script.google.com/macros/s/AKfycbzblt6BlpnAcGBtw_gPDeZcH1lYhOXSlFi8gA4sV7ONn4g_ZSusCazAqAlhyRTIhYXL/exec';
let NICK='익명',LOG=[],T0=0;
function sendLog(ending,sc){if(!SHEET_URL)return;
  try{fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({nickname:NICK,choices:LOG.slice(),ending:ending,score:Math.round(sc),playSeconds:Math.round((Date.now()-T0)/1000)})}).catch(()=>{});}catch(e){}}
mload();
document.getElementById('go').onclick=()=>{NICK=(document.getElementById('nick').value||'').trim().slice(0,20)||'익명';aInit();SFX.coin();home();};
})();
</script>
