<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>팬데믹 대통령</title>
<style>
:root{
  --bg:#101418;--surface-0:#171c22;--surface-1:#1d232b;--surface-2:#1a2027;
  --border:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.22);
  --text-primary:#e9ecef;--text-secondary:#a7afb8;--text-muted:#6b737d;
  --text-danger:#f0605f;--text-success:#3fc38f;--text-warning:#eda100;
  --radius:8px;
  --font-ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  --font-voice:"Noto Serif KR","Apple Myungjo",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{max-width:440px;margin:0 auto;padding:22px 16px 48px;min-height:100vh}
button{font:inherit;color:var(--text-primary);background:var(--surface-0);border:1px solid var(--border-strong);border-radius:10px;padding:10px 14px;cursor:pointer;line-height:1.4;transition:background .15s,transform .08s}
button:hover{background:var(--surface-1)}
button:active{transform:scale(.985)}
button:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible{outline:2px solid #6250d6;outline-offset:2px}
em{font-style:normal;font-weight:600;color:var(--text-danger)}
canvas{display:block}
@keyframes fxL{0%{opacity:0;transform:scale(.6)}22%{opacity:1;transform:scale(1.08)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.02)}}
@keyframes fxT{0%{opacity:0}28%{opacity:1}100%{opacity:0}}
@keyframes shk{0%,100%{transform:translateX(0)}12%{transform:translateX(-8px)}28%{transform:translateX(7px)}44%{transform:translateX(-5px)}62%{transform:translateX(4px)}82%{transform:translateX(-2px)}}
@keyframes fdIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes wIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@keyframes optIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(2) rotate(-12deg)}55%{opacity:1;transform:scale(.92) rotate(-5deg)}100%{transform:scale(1) rotate(-5deg)}}
@keyframes reelIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.lb-dot{width:8px;height:8px;border-radius:50%;background:#3fc38f;margin-top:4px;flex-shrink:0;animation:lbPing 1.8s infinite}
.lb-dot.off{background:#f0605f;animation:none}
@keyframes lbPing{0%{box-shadow:0 0 0 0 rgba(63,195,143,.55)}70%{box-shadow:0 0 0 7px rgba(63,195,143,0)}100%{box-shadow:0 0 0 0 rgba(63,195,143,0)}}
.lb-banner{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:14px;line-height:1.6;border:1px solid rgba(139,124,246,.55);background:linear-gradient(135deg,rgba(139,124,246,.18),var(--surface-2) 70%)}
.lb-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.lb-tile{background:var(--surface-1);border-radius:var(--radius);padding:8px 10px;min-width:0}
.lb-tile .k{font-size:10px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-tile .v{font-size:17px;font-weight:700;margin-top:1px}
.lb-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.lb-tabs::-webkit-scrollbar{display:none}
.lb-tabs button{flex-shrink:0;font-size:13px;padding:7px 12px}
.lb-tabs button[aria-selected="true"]{border-color:#8b7cf6;background:rgba(139,124,246,.14);font-weight:600}
.card-lb{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.lb-podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:6px;align-items:end;margin-bottom:10px}
.lb-pod{border-radius:12px;padding:10px 6px;text-align:center;background:var(--surface-1);border:1px solid var(--border);min-width:0;animation:lbRise .45s cubic-bezier(.2,.8,.2,1) both}
.lb-pod .medal{width:26px;height:26px;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#14181d}
.lb-pod .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-pod .sc{font-size:20px;font-weight:800;margin:3px 0 1px}
.lb-pod .ld{font-size:10px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-pod.p1{padding:15px 6px;border-color:rgba(245,196,81,.5);background:linear-gradient(180deg,rgba(245,196,81,.16),var(--surface-1) 70%)}
.lb-pod.p1 .sc{font-size:25px}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 3px;border-bottom:1px solid var(--border);animation:lbRise .3s ease-out both}
.lb-row:last-child{border-bottom:none}
.lb-row .rk{width:26px;text-align:center;font-size:14px;font-weight:700;color:var(--text-secondary);flex-shrink:0}
.lb-row .who{flex:1;min-width:0}
.lb-row .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-row .mt{font-size:11px;color:var(--text-secondary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-row .ex{font-size:10px;color:var(--text-muted);margin-top:3px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.lb-row .val{text-align:right;flex-shrink:0}
.lb-row .val .b{font-size:17px;font-weight:800}
.lb-row .val .s{font-size:10px;color:var(--text-muted)}
.lb-row.mine{background:rgba(139,124,246,.13);border-radius:10px;box-shadow:inset 3px 0 0 #8b7cf6}
.lb-g{display:inline-block;min-width:15px;text-align:center;font-size:10px;font-weight:800;border-radius:4px;padding:0 3px;background:rgba(255,255,255,.07)}
.lb-new{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:#3fc38f;color:#0f1a14;vertical-align:middle}
.lb-hb{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.lb-hb .n{width:104px;flex-shrink:0;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-hb .tr{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.lb-hb .tr span{position:absolute;left:0;top:0;bottom:0;border-radius:5px;animation:barG .8s cubic-bezier(.2,.8,.2,1) both}
.lb-hb .c{width:28px;text-align:right;color:var(--text-muted);flex-shrink:0}
.lb-note{font-size:11px;color:var(--text-muted);line-height:1.6;margin:6px 2px 10px}
.lb-skel{height:48px;border-radius:10px;background:linear-gradient(90deg,var(--surface-1),#232a33,var(--surface-1));background-size:200% 100%;animation:lbSh 1.2s infinite;margin-bottom:8px}
@keyframes lbSh{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes lbRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lbFresh{0%{background:rgba(63,195,143,.35)}100%{background:transparent}}
.lb-still .lb-row,.lb-still .lb-pod,.lb-still .lb-hb .tr span{animation:none}
.lb-still .lb-row.fresh,.lb-still .lb-pod.fresh{animation:lbFresh 2.4s ease-out both}
@keyframes barG{from{width:0}}
@keyframes upY{from{transform:scaleY(0)}}
@keyframes drawL{to{stroke-dashoffset:0}}
.skip #txt span,.skip .late{animation:none!important;opacity:1!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div id="root">
    <div style="font-size:11px;color:var(--text-muted);letter-spacing:3px;margin-bottom:10px">현대 민주주의 · 한 번의 인생</div>
    <div style="font-size:34px;font-weight:600;line-height:1.12;margin-bottom:16px">팬데믹<br>대통령</div>
    <div style="font-size:14px;color:var(--text-secondary);line-height:1.8;margin-bottom:10px">취임 3주 만에 <em>첫 확진자</em>가 나왔다. 임기 말에 과반의 지지를 지키면 <em>연임</em>할 수 있다. 몇 번의 임기를 보낼지, 언제 내려올지는 당신이 정한다.</div>
    <div style="font-size:13px;color:var(--text-muted);line-height:1.8;margin-bottom:24px">감염은 지수적으로 번지고 사라지지 않는다. 권한을 쥐면 유착이 자라고, 지지율은 가만히 두면 떨어진다. 볼 수 있는 것은 <em>인구 지도와 참모의 귓속말</em>뿐이다.</div>
    <label for="nick" style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px">닉네임 (최대 20자, 비우면 익명)</label>
    <input id="nick" maxlength="20" placeholder="익명" autocomplete="off" style="width:100%;box-sizing:border-box;padding:12px;font-size:15px;margin-bottom:10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary)">
    <div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">※ 플레이 결과가 기록됩니다 (닉네임·선택·임기·엔딩·점수·플레이 시간)</div>
    <button id="go" style="width:100%;padding:15px;font-size:15px">▶&nbsp; 시작 (소리 켜짐)</button>
    <div style="font-size:11px;color:var(--text-muted);margin-top:12px;text-align:center">최고 기록과 도감은 이 브라우저에 저장된다</div>
  </div>
</div>

 mute:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>'};

{p:.10,n:'대성공',g:2.0,b:.2,ms:950,fs:34,fg:'var(--text-success)',tint:'rgba(27,175,122,.22)',bd:'#1baf7a',l:[
'모든 것이 맞아떨어졌다. 이 대응은 이후 다른 나라 브리핑에서 <em>모범 사례</em>로 여러 번 인용됐다.',

'타이밍이 완벽했다. 하루만 늦었어도 전혀 다른 이야기가 됐을 것이다.',

{p:.55,n:'성공',g:1.0,b:1.0,ms:480,fs:22,fg:'var(--text-secondary)',tint:'rgba(136,135,128,.12)',bd:'rgba(255,255,255,.35)',l:[

'발표 전에 내용이 새어 나갔다. 사람들은 정부의 의도보다 유출된 문서를 먼저 읽었다.',

const AU={ac:null,m:null,on:true,filt:null,dg:null,hb:0};
function aInit(){if(AU.ac){if(AU.ac.state==='suspended')AU.ac.resume();return;}
  try{AU.ac=new (window.AudioContext||window.webkitAudioContext)();AU.m=AU.ac.createGain();AU.m.gain.value=AU.on?.7:0;AU.m.connect(AU.ac.destination);
  const o1=AU.ac.createOscillator(),o2=AU.ac.createOscillator();o1.type='sine';o2.type='triangle';o1.frequency.value=55;o2.frequency.value=82.4;o2.detune.value=-7;
  AU.filt=AU.ac.createBiquadFilter();AU.filt.type='lowpass';AU.filt.frequency.value=160;AU.dg=AU.ac.createGain();AU.dg.gain.value=0;
  o1.connect(AU.filt);o2.connect(AU.filt);AU.filt.connect(AU.dg);AU.dg.connect(AU.m);o1.start();o2.start();
  setInterval(hbTick,90);}catch(e){}}
function tone(f,type,dur,vol,when,slide){if(!AU.ac)return;when=when||0;const t0=AU.ac.currentTime+when,o=AU.ac.createOscillator(),g=AU.ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(AU.m);o.start(t0);o.stop(t0+dur+.05);}
function noise(dur,vol,when,cut){if(!AU.ac)return;when=when||0;const t0=AU.ac.currentTime+when,n=Math.floor(AU.ac.sampleRate*dur),b=AU.ac.createBuffer(1,n,AU.ac.sampleRate),d=b.getChannelData(0);
  for(let k=0;k<n;k++)d[k]=Math.random()*2-1;const s=AU.ac.createBufferSource();s.buffer=b;const f=AU.ac.createBiquadFilter();f.type='lowpass';f.frequency.value=cut||800;
  const g=AU.ac.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);s.connect(f);f.connect(g);g.connect(AU.m);s.start(t0);}
const SFX={

  else if(t===2){tone(330,'sawtooth',.28,.1);tone(233,'sawtooth',.42,.11,.16);}

function hbTick(){if(!S||!AU.ac||S.i<52||!AU.on)return;const per=1350-S.i*7,t=performance.now();if(t-AU.hb>per){AU.hb=t;tone(52,'sine',.13,.32);tone(50,'sine',.12,.26,.2);}}

/* ---------- MAP ---------- */
const MAP={d:[],nb:[],inf:new Set(),dead:new Set(),tgt:10,dtgt:0,last:0,run:false};
(function(){const C=30,Rw=11;for(let r=0;r<Rw;r++)for(let c=0;c<C;c++){MAP.d.push({x:(c+.5)/C+(Math.random()-.5)*.02,y:(r+.5)/Rw+(Math.random()-.5)*.05,ph:Math.random()*6.28});}
 for(let r=0;r<Rw;r++)for(let c=0;c<C;c++){const a=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&rr<Rw&&cc>=0&&cc<C)a.push(rr*C+cc);}MAP.nb.push(a);}})();
function mapReset(){MAP.inf.clear();MAP.dead.clear();MAP.tgt=INIT.i;MAP.dtgt=0;}
function mapUpdate(){const N=MAP.d.length,want=Math.round(MAP.tgt/100*N);
  for(let s=0;s<4;s++){if(MAP.inf.size<want){let done=false;if(MAP.inf.size){const arr=[...MAP.inf],src=arr[Math.floor(Math.random()*arr.length)];const nb=MAP.nb[src].filter(j=>!MAP.inf.has(j)&&!MAP.dead.has(j));if(nb.length){MAP.inf.add(nb[Math.floor(Math.random()*nb.length)]);done=true;}}
    if(!done){const free=[];for(let k=0;k<N;k++)if(!MAP.inf.has(k)&&!MAP.dead.has(k))free.push(k);if(free.length)MAP.inf.add(free[Math.floor(Math.random()*free.length)]);}}
   else if(MAP.inf.size>want){const arr=[...MAP.inf];MAP.inf.delete(arr[Math.floor(Math.random()*arr.length)]);}else break;}
  const wd=Math.min(Math.round(N*.4),Math.round(MAP.dtgt/4));
  if(MAP.dead.size<wd){let cand=[...MAP.inf];if(!cand.length){cand=[];for(let k=0;k<N;k++)if(!MAP.dead.has(k))cand.push(k);}if(cand.length){const k=cand[Math.floor(Math.random()*cand.length)];MAP.inf.delete(k);MAP.dead.add(k);}}}
function mapDraw(){const c=document.getElementById('map');if(!c)return;const w=c.clientWidth||320,h=118;
  if(c.width!==Math.round(w*DPR)){c.width=Math.round(w*DPR);c.height=Math.round(h*DPR);}
  const x=c.getContext('2d');x.setTransform(DPR,0,0,DPR,0,0);x.clearRect(0,0,w,h);const t=performance.now()/1000;
  for(let k=0;k<MAP.d.length;k++){const d=MAP.d[k],px=d.x*w,py=d.y*h;
    if(MAP.dead.has(k)){x.fillStyle='rgba(70,52,56,.95)';x.beginPath();x.arc(px,py,1.5,0,6.283);x.fill();}
    else if(MAP.inf.has(k)){const p=.7+.3*Math.sin(t*4.2+d.ph);x.shadowColor='#e34948';x.shadowBlur=8;x.fillStyle='rgba(227,73,72,'+p+')';x.beginPath();x.arc(px,py,2.5,0,6.283);x.fill();x.shadowBlur=0;}
    else{x.fillStyle='rgba(160,168,178,.32)';x.beginPath();x.arc(px,py,1.7,0,6.283);x.fill();}}}
function mapLoop(){if(!MAP.run)return;const t=performance.now();if(t-MAP.last>70){MAP.last=t;mapUpdate();}mapDraw();requestAnimationFrame(mapLoop);}
function mapStart(){if(MAP.run)return;MAP.run=true;requestAnimationFrame(mapLoop);}

 ['취임사에서 비상대권을 요구한다',{p:13,i:-9,chk:-9,a:3},'박수와 우려가 동시에 나왔다. 권한은 손에 들어왔다.'],

function reel(t,cb){const f=document.getElementById('fx'),w=document.getElementById('wrap');

   else{setTimeout(()=>{const T=TIER[t],ms=Math.round(T.ms*.7);SFX.tier(t);vib(t===3?[70,50,90]:t===2?45:t===0?[20,30,20]:0);

function takeSnap(){snap={S:Object.assign({},S),deaths:deaths,yd:yd,cd:cDeaths,q:queue.slice(),cl:chron.length,hl:hist.length,st:streak,pi:peakI,th:TH.length};}

function resolve(o,t){const e=o[1],ch=o[3];logTier(t);
  chron.push({t:t,n:cur.t});hist.push(t);streak=(t<=1)?streak+1:0;

  else if(e.X==='quit'){S.quit=1;return careerEnd('quit');}
  else{apply(e,0,t);last={t:t,x:o[2]+' '+pk(TIER[t].l)};
    if(t===3){S.a=cl(S.a-4);S.u=cl(S.u+4);}

function gate(kind){if(tok<=0)return careerEnd(kind);SFX.gate();vib([120,80,160]);
  R.innerHTML='<div style="animation:fdIn .5s ease-out;position:relative"><div style="position:absolute;inset:-6px;pointer-events:none;border-radius:12px;background:radial-gradient(ellipse at center,transparent 40%,rgba(227,73,72,.35) 100%)"></div>'+

  '<button id="rr" style="width:100%;margin-bottom:8px;padding:13px"><span style="color:#8b7cf6">●</span>&nbsp; 운명에 개입한다 (남은 '+tok+'회)</button>'+

function apply(e,raw,t){const T=TIER[t===undefined?1:t],mom=streak>=4?1.1:1;
  for(const k in e){if(k==='X')continue;const v=e[k],good=BAD[k]?v<0:v>0;S[k]=cl(S[k]+(raw?v:v*EVS*(good?T.g*mom:T.b)));}}

// 한 번 호출 = 1개월. 결정 빈도와 상관없이 1년에 12번 돈다. 임기가 거듭될수록(TD) 확산·피해·부패 압력이 커지고 지지율은 더 빨리 빠진다.
function tick(){const te=MOD.te||1,D=DIFF[dif],yr=Math.floor(S.turn/PY),TD=CAR.term-1;
  let r=.18+S.u/500+(MOD.ip||0)+yr*.022+D.r+TD*.02-S.p/330-(S.trn*te)/900-S.m/1100;r=Math.max(-.11,Math.min(.36,r));
  S.i=cl(Math.max(D.fl,S.i+S.i*r*(1-S.i/100)));if(S.i>peakI)peakI=S.i;
  S.m=cl(S.m-Math.max(0,S.i-50)/13+S.e/150+.2);
  const dd=(S.i/28)*(1+Math.max(0,50-S.m)/42)*(MOD.dd||1)*D.dd*(1+TD*.2);deaths+=dd;yd+=dd;cDeaths+=dd;
  S.e=cl(S.e-S.i/72-S.p/170+S.saf/210+.48+(MOD.ep||0)-S.c/62);
  S.c=cl(S.c+.22+TD*.07+Math.max(0,S.p-34)/22*(1-(S.trn*te)/150)-(S.trn*te)/320);
  S.u=cl(S.u+S.i/95+Math.max(0,S.p-45)/47+Math.max(0,45-S.e)/58-S.saf/230-.32+(MOD.up||0));
  S.a=cl(S.a-.32-D.ad-TD*.06-Math.max(0,S.a-55)/65+Math.max(0,S.p-40)/260*(S.i>40?1:0)-S.i/85-Math.max(0,48-S.e)/62-S.u/130-S.c/160+Math.max(0,S.e-55)/95+(MOD.ap||0));
  S.p=cl(S.p-S.chk/100*(S.p/115));
  S.chk=cl(S.chk-.12-TD*.03-Math.max(0,S.p-45)/70);S.trn=cl(S.trn-.1-S.c/260);S.saf=cl(S.saf-.08);}

const KN={a:'지지율',i:'확산',m:'의료',e:'경제',p:'행정 권한',c:'유착',u:'갈등',chk:'견제',trn:'투명성',saf:'안전망'};
function deltas(){if(!snap)return '';const ch=[];
  for(const k in KN){const d=S[k]-snap.S[k];if(Math.abs(d)>=2.5)ch.push([k,d]);}
  ch.sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  return ch.slice(0,4).map(([k,d],j)=>{const good=k==='p'?null:(BAD[k]?d<0:d>0),col=good===null?'#b3a7ff':good?'#3fc38f':'#f0605f',ar=d>0?(Math.abs(d)>=9?'▲▲':'▲'):(Math.abs(d)>=9?'▼▼':'▼');
    return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 9px;border-radius:999px;background:var(--surface-1);border:1px solid var(--border);margin:0 5px 5px 0;opacity:0;animation:fdIn .3s ease-out forwards;animation-delay:'+(j*70)+'ms">'+KN[k]+' <b style="color:'+col+';font-size:11px">'+ar+'</b></span>';}).join('');}

function res(){const T=TIER[last.t],wc=last.x.split(' ').length,dl=Math.min(650,wc*22+120);
  R.innerHTML='<div id="wrap" style="position:relative">'+vign()+hud()+
  '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span style="font-size:11px;padding:3px 10px;border-radius:var(--radius);background:'+T.tint+';color:'+T.fg+';font-weight:600;letter-spacing:2px">'+T.n+'</span><span style="font-size:11px;color:var(--text-muted)">'+cur.t+'</span></div>'+
  '<div id="txt" style="border-left:3px solid '+T.bd+';padding:4px 0 4px 14px;margin-bottom:12px;cursor:pointer"><div style="font-size:15px;line-height:1.9">'+words(last.x,40)+'</div></div>'+
  '<div style="margin-bottom:14px;min-height:28px">'+deltas()+'</div>'+
  '<button id="nx" class="late" style="width:100%;margin-bottom:8px;padding:13px;opacity:0;animation:fdIn .3s ease-out forwards;animation-delay:'+dl+'ms">계속</button>'+
  (tok>0&&last.t>=2?'<button id="rr" class="late" style="width:100%;font-size:13px;color:#8b7cf6;opacity:0;animation:fdIn .3s ease-out forwards;animation-delay:'+(dl+120)+'ms">● 운명에 개입한다 (남은 '+tok+'회)</button>':'')+
  '<div style="text-align:center;font-size:11px;color:var(--text-muted);margin-top:6px">글을 누르면 바로 넘길 수 있다</div></div>';
  bindSnd();
  const w=document.getElementById('wrap');document.getElementById('txt').onclick=()=>{w.classList.add('skip');};
  document.getElementById('nx').onclick=()=>{SFX.click();S.turn++;if(S.turn%PY===0)return report();next();pickAdv();ev();};
  const r=document.getElementById('rr');if(r)r.onclick=reroll;}

function next(){if(queue.length){cur=queue.shift();return;}
  if(S.u>44&&Math.random()<Math.pow(S.u/100,2)*(.35+S.c/110)*(1-S.chk/180)*.22){cur=(S.chk>=48)?IMP:UPR;return;}
  const y=Math.floor(S.turn/PY)+1,T=CAR.term;
  const okf=e=>(e.y===0||e.y===y)&&(!e.tm||T>=e.tm)&&(!e.w||e.w(S));
  let ok=pool.filter(okf);
  const fresh=ok.filter(e=>!SEEN.has(e.t));if(fresh.length)ok=fresh;
  if(T>=2){const te=ok.filter(e=>e.tm);if(te.length&&Math.random()<.3+.08*(T-2))ok=te;}
  if(!ok.length){pool=EV.slice();ok=pool.filter(okf);}
  cur=pk(ok);if(pool.indexOf(cur)>=0)pool.splice(pool.indexOf(cur),1);SEEN.add(cur.t);}

function score(){const ins=Math.max(0,(S.chk+S.trn+S.saf)-base),ds=cl(100-deaths/2.2);
  return S.a*.26+ds*.27+S.e*.19+(100-S.c)*.11+Math.min(100,ins*1.25)*.17;}

/* ---------- CHARTS (숫자 없이) ---------- */
function bars(rows){return rows.map((r,k)=>{const v=Math.round(cl(r.v)),pv=r.pv==null?null:Math.round(cl(r.pv));
  const col=r.neu?'#8b7cf6':v>=66?'#3fc38f':v>=40?'#eda100':'#f0605f';
  const d=pv==null?0:v-pv,ar=d>=3?'▲':d<=-3?'▼':'–',ac=r.neu?'#b3a7ff':d>=3?'#3fc38f':d<=-3?'#f0605f':'var(--text-muted)';
  return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px"><span style="width:62px;font-size:12px;color:var(--text-secondary);flex-shrink:0">'+r.n+'</span>'+
  '<span style="position:relative;flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.06)">'+
  '<span style="position:absolute;left:0;top:0;bottom:0;width:'+v+'%;border-radius:5px;background:'+col+';animation:barG .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:'+(k*55)+'ms"></span>'+
  (pv!=null?'<span style="position:absolute;top:-3px;bottom:-3px;left:calc('+pv+'% - 1px);width:2px;background:rgba(255,255,255,.6);border-radius:1px"></span>':'')+
  '</span><span style="width:14px;font-size:11px;text-align:center;color:'+ac+'">'+ar+'</span></div>';}).join('');}
function lineChart(series,n){const W=300,H=100,P=5,X=i=>P+i*(W-2*P)/n,Y=v=>P+(100-v)*(H-2*P)/100;
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" aria-hidden="true">';
  for(let y=1;y<YRS;y++){const x=X(y*PY).toFixed(1);s+='<line x1="'+x+'" x2="'+x+'" y1="0" y2="'+H+'" stroke="rgba(255,255,255,.06)"/>';}
  s+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+Y(50)+'" y2="'+Y(50)+'" stroke="rgba(255,255,255,.35)" stroke-dasharray="3 4"/>';
  series.forEach(se=>{if(se.pts.length<2)return;const d=se.pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    s+='<path d="'+d+'" fill="none" stroke="'+se.col+'" stroke-width="'+se.w+'" stroke-linejoin="round" stroke-linecap="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:drawL 1.1s ease-out forwards"/>';
    const j=se.pts.length-1;s+='<circle cx="'+X(j).toFixed(1)+'" cy="'+Y(se.pts[j]).toFixed(1)+'" r="3.2" fill="'+se.col+'"/>';});
  return s+'</svg>';}
function dirByYear(){const ys=[];LOG.forEach(x=>{if(x.eventType==='임기 결정')return;(ys[x.cyear-1]=ys[x.cyear-1]||[]).push(x.dirScore);});
  const out=[];for(let i=0;i<ys.length;i++){const a=ys[i]||[];out.push(a.length?a.reduce((p,q)=>p+q,0)/a.length:0);}return out;}
function powerChart(){const v=dirByYear(),n=Math.max(v.length,1),W=300,H=128,mid=64,bw=(W-10)/n,sc=v2=>Math.max(-1,Math.min(1,v2/14))*54;
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" aria-hidden="true">';
  s+='<line x1="4" x2="'+(W-4)+'" y1="'+mid+'" y2="'+mid+'" stroke="rgba(255,255,255,.25)"/>';
  for(let t=1;t*YRS<n;t++){const x=(5+t*YRS*bw).toFixed(1);s+='<line x1="'+x+'" x2="'+x+'" y1="4" y2="'+(H-4)+'" stroke="rgba(255,255,255,.12)" stroke-dasharray="2 3"/>';}
  for(let t=0;t*YRS<n;t++){s+='<text x="'+(7+t*YRS*bw).toFixed(1)+'" y="12" font-size="9" fill="rgba(255,255,255,.45)">'+(t+1)+'기</text>';}
  v.forEach((d,i)=>{const h=sc(d),x=5+i*bw+bw*.18,w=bw*.64,y=h>=0?mid-h:mid,col=h>=0?'#f0605f':'#4a8fe0';
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(1.5,Math.abs(h)).toFixed(1)+'" rx="2" fill="'+col+'" style="transform-origin:'+(x+w/2).toFixed(1)+'px '+mid+'px;animation:upY .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:'+(i*45)+'ms"/>';});
  return s+'</svg>';}
const sbar=(n,v,mx,col,sub,k)=>'<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span><b>'+n+'</b> <span style="color:var(--text-muted)">'+sub+'</span></span><span style="font-weight:600">'+v+' <span style="color:var(--text-muted);font-weight:400">/ '+mx+'</span></span></div>'+
  '<div style="height:8px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden"><div style="height:100%;width:'+Math.max(0,Math.min(100,v/mx*100))+'%;background:'+col+';border-radius:4px;animation:barG .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:'+(500+k*120)+'ms"></div></div></div>';
const chip=(t,col,ex)=>'<span style="display:inline-block;font-size:11px;padding:4px 9px;border-radius:var(--radius);margin:0 5px 5px 0;background:var(--surface-1);border-left:2px solid '+col+';'+(ex||'')+'">'+t+'</span>';

/* ---------- 연간 결산 ---------- */
function report(){SFX.report();window.scrollTo(0,0);
  const y=S.turn/PY,fin=S.turn>=YRS*PY,sc=score();let tr='';
  if(prev!==null){const d=sc-prev;tr=d>3?'전체적으로 작년보다 나아지고 있습니다.':d<-3?'솔직히 말씀드리면, <em>작년보다 나빠지고 있습니다</em>.':'작년과 크게 다르지 않습니다.';}
  prev=sc;
  const earned=TRO.filter(t=>{try{return t.c();}catch(e){return false;}}).sort((a,b)=>b.g-a.g).filter((t,j,arr)=>t.g?arr.filter(z=>z.g).indexOf(t)<2:true);
  earned.forEach(t=>CAR.tro.push({id:t.id,n:t.n,g:t.g,term:CAR.term,year:y}));
  CAR.cs.push(S.c);CAR.ts.push(S.trn);
  const tro=earned.length?earned.map((t,j)=>chip((t.g?'업적 · ':'불명예 · ')+t.n,t.g?'#3fc38f':'#f0605f','animation:reelIn .4s cubic-bezier(.2,1.4,.4,1) both;animation-delay:'+(300+j*120)+'ms;font-weight:600;color:'+(t.g?'#9ff0c9':'#ffb3b2'))).join(''):'<span style="font-size:12px;color:var(--text-muted)">올해는 특별한 기록이 없다.</span>';
  const P=YS,rows=[
    {n:'지지율',v:S.a,pv:P.a},{n:'방역',v:100-S.i,pv:100-P.i},{n:'의료',v:S.m,pv:P.m},{n:'경제',v:S.e,pv:P.e},
    {n:'사회 통합',v:100-S.u,pv:100-P.u},{n:'청렴',v:100-S.c,pv:100-P.c},{n:'견제 장치',v:S.chk,pv:P.chk},{n:'투명성',v:S.trn,pv:P.trn}];
  const pw=[{n:'행정 권한',v:S.p,pv:P.p,neu:1}];
  const cr=chron.map(c=>chip(c.n,TIER[c.t].bd)).join('');
  const worst=[['i',100-S.i],['m',S.m],['a',S.a],['e',S.e],['u',100-S.u],['c',100-S.c]].sort((a,b)=>a[1]-b[1])[0][0];
  const say=RP[worst][bd(S[worst])];
  R.innerHTML='<div style="position:relative;animation:fdIn .35s ease-out">'+
   '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px"><span style="font-size:11px;color:var(--text-muted);letter-spacing:2px">'+CAR.term+'기 '+y+'년차 연말 · '+ageNow()+'세</span><span style="font-size:11px;color:var(--text-muted)">'+MOD.n+'</span></div>'+
   '<div style="font-size:22px;font-weight:600;margin-bottom:12px">'+(fin?'임기 마지막 결산':'연간 총결산')+'</div>'+
   card(lab('올해의 기록')+tro)+
   card(lab('국정 지표 · 흰 눈금은 작년')+bars(rows)+'<div style="height:1px;background:var(--border);margin:6px 0 12px"></div>'+bars(pw)+
     '<div style="font-size:11px;color:var(--text-muted);line-height:1.6;margin-top:4px">행정 권한은 크다고 좋은 것도, 작다고 나쁜 것도 아니다.</div>')+
   card(lab('임기 흐름')+lineChart([{pts:TH.map(h=>100-h.i),col:'#f0605f',w:1.6},{pts:TH.map(h=>h.a),col:'#3fc38f',w:2.4}],YRS*PY)+
     '<div style="display:flex;gap:14px;font-size:11px;color:var(--text-muted);margin-top:8px;flex-wrap:wrap"><span><b style="color:#3fc38f">━</b> 지지율</span><span><b style="color:#f0605f">━</b> 방역 상태</span><span>┄ 과반선(재선 기준)</span></div>')+
   '<div style="display:flex;gap:10px;align-items:flex-start;margin:4px 4px 14px"><span style="width:28px;height:28px;border-radius:50%;background:var(--surface-1);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:var(--text-muted)">참</span>'+
   '<div style="font-size:13px;line-height:1.7;color:var(--text-secondary);font-family:var(--font-voice)">"'+say+(tr?' '+tr:'')+'"</div></div>'+
   lab('그해의 결정들')+'<div style="margin-bottom:18px">'+cr+'</div>'+
   '<button id="nx" style="width:100%;padding:14px;font-weight:600">'+(fin?'임기 만료':(y+1)+'년차로')+'</button></div>';
  CAR.yrs.push(yearSnap(y,earned,1));
  chron=[];yd=0;yTally=[0,0,0,0];YS=Object.assign({},S);
  document.getElementById('nx').onclick=()=>{SFX.click();if(fin)return termEnd();next();pickAdv();ev();};}

/* ---------- 임기 평가 · 연임 ---------- */
const ENDS={ousted:['거리로 쫓겨난 대통령','여론과 광장이 정권을 먼저 끝냈다. 방역의 성패를 따지기도 전에 정부가 사라졌다.','#f0605f'],
medfail:['의료 붕괴','병상도 인력도 남지 않았다. 이 시기의 사망자 수는 이후 어떤 통계에서도 정상으로 분류되지 않는다.','#f0605f'],
ecofail:['무너진 경제','방역은 어떻게든 했다. 사람들이 돌아갈 일자리가 남지 않았을 뿐이다.','#eb6834']};
const r1=v=>Math.round(v*10)/10;
// 임기 점수 = 지지율×0.26 + 생명 보호×0.27 + 경제×0.19 + 청렴(100−유착)×0.11 + 제도 변화×0.17
function scoreParts(){const ins=Math.max(0,(S.chk+S.trn+S.saf)-base),life=cl(100-deaths/2.2),inst=Math.min(100,ins*1.25);
  return {a:r1(S.a*.26),life:r1(life*.27),eco:r1(S.e*.19),clean:r1((100-S.c)*.11),inst:r1(inst*.17),lifeScore:r1(life),instScore:r1(inst)};}
function choiceStats(N){const avg=a=>a.length?r1(a.reduce((p,q)=>p+q,0)/a.length):'';
  return {nCh:N.length,nConc:N.filter(z=>z.direction==='권력 집중').length,nDisp:N.filter(z=>z.direction==='견제·분산').length,nNeut:N.filter(z=>z.direction==='중립').length,avgDir:avg(N.map(z=>z.dirScore))};}
function yearSnap(y,earned,done){const N=LOG.filter(z=>z.term===CAR.term&&z.year===y&&z.eventType!=='임기 결정');
  return Object.assign({term:CAR.term,year:y,cyear:(CAR.term-1)*YRS+y,age:CAR.age0+(CAR.term-1)*YRS+y-1,done:done?'예':'아니오(중간에 끝남)',
    score:r1(score()),grade:grade(score()),yd:Math.round(yd),cDeaths:Math.round(cDeaths),
    troGood:earned.filter(t=>t.g).map(t=>t.n).join(', '),troBad:earned.filter(t=>!t.g).map(t=>t.n).join(', '),
    dice0:yTally[0],dice1:yTally[1],dice2:yTally[2],dice3:yTally[3]},stNow(),choiceStats(N));}
// 진행 중이던 해에 이미 고른 선택이 있으면 그 해를 '중간에 끝남'으로 남긴다
function partialYear(){const y=Math.floor(S.turn/PY)+1;return y<=YRS&&!CAR.yrs.some(z=>z.term===CAR.term&&z.year===y)&&LOG.some(z=>z.term===CAR.term&&z.year===y)?y:0;}
function evalTerm(kind){
  const ins=Math.max(0,(S.chk+S.trn+S.saf)-base);
  let sc=score();if(kind==='quit')sc-=6;const auth=(S.p>=60&&S.chk<=44),g=grade(sc);
  let eid,ti,ds,col;
  if(ENDS[kind]){eid=kind;ti=ENDS[kind][0];ds=ENDS[kind][1];col=ENDS[kind][2];}
  else if(kind==='quit'){eid='quit';ti='임기를 채우지 못한 대통령';ds='스스로 내려왔다. 그 판단이 옳았는지는 오래 논쟁거리로 남는다.';col='#8a9099';}
  else if(S.c>=60&&S.a>=48){eid='shadow';ti='그림자 정부';ds='유착은 극에 달했는데 지지율은 무너지지 않았다. <em>부패한 정부가 사랑받을 수 있다</em>는 가장 불편한 증명이 됐다.';col='#f0605f';}
  else if(deaths<34&&S.e>=60&&peakI<=45){eid='kmyth';ti='기적의 방역';ds='사람도 지키고 경제도 지켰다. 다른 나라들은 <em>둘 중 하나는 포기해야 했다</em>.';col='#3fc38f';}
  else if(S.trn>=86&&ins>=20){eid='science';ti='과학이 이겼다';ds='이 정부의 무기는 권한이 아니라 <em>공개된 데이터</em>였다. 사람들은 명령이 아니라 근거를 따라 움직였다.';col='#4a8fe0';}
  else if(S.a>=58&&S.e>=58&&S.m>=58&&S.i<=25&&S.c<=28&&S.u<=35){eid='balance';ti='완벽한 균형';ds='방역, 경제, 의료, 여론, 청렴. <em>무엇 하나 버리지 않았다</em>. 교과서는 이런 사례를 오래 찾고 있었다.';col='#8b7cf6';}
  else if(auth&&sc<70){eid='auth';ti='권위주의로 돌아선 대통령';ds='위기를 이유로 얻은 권한을 끝내 돌려주지 않았다. <em>다음 대통령도 그 권한을 쓴다.</em>';col='#f0605f';}
  else if(ins>=28&&S.a>=45){eid='inst';ti='제도를 남긴 대통령';ds='개인의 판단이 아니라 <em>구조를 바꿨다</em>. 다음 팬데믹에 이 나라가 덜 죽는다면 그건 이 임기 덕분이다.';col='#8b7cf6';}
  else if(sc>=80){eid='legend';ti='역사에 남을 대응';ds='세계가 이 나라의 사례를 인용했다. 그리고 실제로 사람이 덜 죽었다.';col='#3fc38f';}
  else if(sc>=66){eid='reelect';ti='신임받은 대통령';ds='완벽하지 않았지만 국민은 이 정부를 믿었다.';col='#3fc38f';}
  else if(sc>=52){eid='modest';ti='무난히 임기를 마친 대통령';ds='큰 실패도 큰 성취도 없었다. 팬데믹 시기 대통령에게 이것이 나쁜 성적인지는 애매하다.';col='#4a8fe0';}
  else if(sc>=36){eid='judged';ti='심판받은 대통령';ds='사람들은 이 4년을 되도록 이야기하지 않으려 한다.';col='#8a9099';}
  else{eid='failfp';ti='실패한 방역';ds='막을 수 있었던 죽음이 너무 많았다. 그것이 이 임기에 대한 유일한 요약이다.';col='#f0605f';}
  const N=LOG.filter(z=>z.term===CAR.term&&z.eventType!=='임기 결정');
  return Object.assign({term:CAR.term,kind:kind,eid:eid,ti:ti,ds:ds,col:col,sc:sc,g:g,ins:ins,auth:auth,peakI:Math.round(peakI),deaths:Math.round(deaths),
    decision:'',months:Math.min(YRS*12,Math.round(S.turn*12/PY)),ageStart:CAR.age0+(CAR.term-1)*YRS,ind:stNow(),cDeaths:Math.round(cDeaths),
    parts:scoreParts(),dice:CAR.tt.slice(),troG:CAR.tro.filter(t=>t.term===CAR.term&&t.g).length,troB:CAR.tro.filter(t=>t.term===CAR.term&&!t.g).length},choiceStats(N));}

/* ---------- 커리어 결산 ---------- */
const EXH={retire:'명예롭게 퇴임했다',lost:'재선에 실패했다',limit:'더는 출마할 수 없었다',ousted:'거리로 쫓겨났다',medfail:'의료 붕괴로 정권이 무너졌다',ecofail:'경제 붕괴로 정권이 무너졌다',quit:'스스로 하야했다'};
function careerStats(){const N=LOG.filter(x=>x.eventType!=='임기 결정'),avg=a=>a.length?a.reduce((p,q)=>p+q,0)/a.length:0;
  const cs=CAR.cs.length?CAR.cs:[S.c],ts=CAR.ts.length?CAR.ts:[S.trn];
  return {dir:avg(N.map(x=>x.dirScore)),perf:avg(CAR.terms.map(t=>t.sc)),cor:avg(cs),trn:avg(ts),terms:CAR.term,exit:CAR.exit,amend:CAR.amend};}
function leaderOf(C){const d=C.dir,f=C.perf;
  if(C.exit==='retire'&&C.terms===1&&d<=3)return 'cinc';
  if(C.exit==='retire'&&C.terms===2&&!C.amend)return 'wash';
  if(C.amend&&C.terms>=4)return 'louis14';
  if(C.amend)return 'napo';
  if(C.exit==='ousted'||C.exit==='quit')return d>=4?'qin':'louis16';
  if(d>=4)return f>=58?(C.cor<30?'marcus':'caesar'):'qin';
  if(d<=-2)return f>=58?'sejong':'peri';
  return f>=58?'lincoln':(C.trn>=70?'peri':'louis16');}
// 커리어 점수(100점 만점) = 성과 70 + 연임 15 + 명예 15
//  성과: 모든 임기 점수의 평균 × 0.7 (임기가 많아도 합이 아니라 평균)
//  연임: 1선 0 · 2선 9 · 3선 12 · 4선 14 · 5선 15 (첫 재선의 혜택이 가장 크고 그 뒤로는 조금씩)
//  명예: 7 + 3 × (1년당 업적 − 1.5 × 불명예) + 퇴장 방식(명예 퇴임 +2, 임기 한도 +1, 하야 −3, 붕괴·축출 −5), 0~15
const CONT=[0,9,12,14,15],EXITPT={retire:2,limit:1,lost:0,quit:-3,ousted:-5,medfail:-5,ecofail:-5};
function careerScore(kind,years){const n=Math.max(1,CAR.terms.length),avg=CAR.terms.reduce((s,t)=>s+cl(t.sc),0)/n;
  const good=CAR.tro.filter(t=>t.g).length,bad=CAR.tro.length-good,net=(good-1.5*bad)/Math.max(1,years),ex=EXITPT[kind]||0;
  const perf=r1(avg*.7),cont=CONT[Math.min(CAR.term,5)-1],honor=r1(Math.max(0,Math.min(15,7+3*net+ex)));
  return {total:Math.max(0,Math.min(100,Math.round(perf+cont+honor))),perf:perf,cont:cont,honor:honor,avg:r1(avg),ex:ex};}
function careerEnd(kind){if(CAR.done)return;CAR.done=1;window.scrollTo(0,0);
  if(CAR.tEval!==CAR.term){const te=evalTerm(ENDS[kind]||kind==='quit'?kind:'done');te.decision=EXH[kind]||kind;CAR.terms.push(te);CAR.tEval=CAR.term;MEM.ends[te.eid]=1;
    const py=partialYear();if(py)CAR.yrs.push(yearSnap(py,[],0));}
  CAR.exit=kind;if(!CAR.cs.length||kind!=='retire'&&kind!=='lost'&&kind!=='limit'){CAR.cs.push(S.c);CAR.ts.push(S.trn);}
  const C=careerStats(),lid=leaderOf(C),L=LEAD[lid];
  const good=CAR.tro.filter(t=>t.g).length,badN=CAR.tro.length-good;
  const years=(CAR.term-1)*YRS+Math.max(1,Math.ceil(S.turn/PY)),age1=CAR.age0+years;
  const SC=careerScore(kind,years),csc=SC.total;
  const newBest=csc>(MEM.best100||0),newLead=!(MEM.leaders||{})[lid];
  MEM.best100=Math.max(MEM.best100||0,csc);MEM.longest=Math.max(MEM.longest||0,years);MEM.careers=(MEM.careers||0)+1;MEM.runs++;MEM.leaders=MEM.leaders||{};MEM.leaders[lid]=1;msave();
  sendCareer(EXH[kind]||kind,{lid:lid,csc:csc,years:years,good:good,bad:badN,SC:SC});
  setAmb(8);
  const ct=CAR.terms.map((t,j)=>'<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);opacity:0;animation:fdIn .35s ease-out forwards;animation-delay:'+(j*90)+'ms">'+
    '<span style="font-size:12px;color:var(--text-muted);width:30px">'+t.term+'기</span><span style="font-size:18px;font-weight:700;color:'+GCOL[t.g]+';width:22px">'+t.g+'</span><span style="font-size:13px;color:'+t.col+'">'+t.ti+'</span></div>').join('');
  const tro=CAR.tro.length?CAR.tro.map(t=>chip(t.n+' <span style="color:var(--text-muted)">· '+t.term+'기 '+t.year+'년</span>',t.g?'#3fc38f':'#f0605f')).join(''):'<span style="font-size:12px;color:var(--text-muted)">남은 기록이 없다.</span>';
  const row=(a,b)=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text-secondary)">'+a+'</span><span style="font-weight:600">'+b+'</span></div>';
  const tg=CAR.terms.map(t=>t.term+'기 '+t.g).join(' · ');
  const summary='팬데믹 대통령 — '+NICK+'의 인생\n'+CAR.bg+' 출신 · '+CAR.term+'선 · '+years+'년 재임 ('+CAR.age0+'–'+age1+'세)\n결말: '+(EXH[kind]||kind)+'\n닮은 지도자: '+L.n+' ('+L.k+')\n임기별 평가: '+tg+'\n업적 '+good+' · 불명예 '+badN+'\n커리어 점수 '+csc+' / 100 (성과 '+SC.perf+' · 연임 '+SC.cont+' · 명예 '+SC.honor+')';
  // 리더보드에 갔다가 돌아오면 이 화면을 다시 그린다
  const show=first=>{window.scrollTo(0,0);
  R.innerHTML='<div style="animation:fdIn .45s ease-out">'+
   lab(NICK+' 대통령의 인생 · '+CAR.bg+' 출신')+
   '<div style="font-size:26px;font-weight:700;line-height:1.25;margin-bottom:6px">'+(EXH[kind]||kind)+'</div>'+
   '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px">'+CAR.term+'선 · '+years+'년 재임 · '+CAR.age0+'세에 취임해 '+age1+'세에 물러남</div>'+
   '<div style="position:relative;border-radius:14px;padding:18px 16px;margin-bottom:12px;background:linear-gradient(135deg,'+L.col+'33,rgba(26,32,39,.9) 60%);border:1px solid '+L.col+'66;overflow:hidden">'+
     '<div style="font-size:11px;letter-spacing:2px;color:var(--text-secondary);margin-bottom:8px">당신과 닮은 지도자'+(newLead?' <span style="color:#fff;background:'+L.col+';padding:1px 6px;border-radius:4px;letter-spacing:0;margin-left:4px">NEW</span>':'')+'</div>'+
     '<div style="font-size:28px;font-weight:700;margin-bottom:2px;animation:fdIn .5s ease-out .2s both">'+L.n+'</div>'+
     '<div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">'+L.era+'</div>'+
     '<div style="display:inline-block;font-size:13px;font-weight:600;color:#fff;background:'+L.col+';padding:3px 10px;border-radius:6px;margin-bottom:10px">'+L.k+'</div>'+
     '<div style="font-size:14px;line-height:1.75;color:var(--text-primary)">'+L.d+'</div>'+
     '<div style="font-size:11px;color:var(--text-muted);margin-top:10px">선택 패턴을 바탕으로 한 게임 속 비유이며, 실제 인물에 대한 평가가 아니다.</div></div>'+
   card(lab('권력 성향 그래프 · 해마다 고른 선택의 방향')+powerChart()+
     '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:6px"><span><b style="color:#f0605f">■</b> 권력 집중</span><span><b style="color:#4a8fe0">■</b> 견제·분산</span></div>')+
   card(lab('임기별 평가')+ct)+
   card(lab('업적 '+good+' · 불명예 '+badN)+tro)+
   '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px">'+
     '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px"><span style="font-size:13px;color:var(--text-secondary)">커리어 점수'+(newBest?' <span style="font-size:11px;color:#3fc38f;margin-left:4px">최고 기록</span>':'')+'</span><span><span id="scn" style="font-size:34px;font-weight:700">0</span><span style="font-size:13px;color:var(--text-muted)"> / 100</span></span></div>'+
     sbar('성과',SC.perf,70,'#4a8fe0','임기 평균 '+SC.avg+'점 × 0.7',0)+sbar('연임',SC.cont,15,'#8b7cf6',CAR.term+'선',1)+sbar('명예',SC.honor,15,'#3fc38f','업적·불명예, '+(SC.ex>0?'명예로운 퇴장 +'+SC.ex:SC.ex<0?'불명예 퇴장 '+SC.ex:'퇴장 보너스 없음'),2)+'</div>'+
   lab('마지막 순간의 숫자')+
   '<div style="background:var(--surface-1);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px">'+
   row('지지율',Math.round(S.a))+row('확산 지수',Math.round(S.i))+row('누적 인명 피해 지수',Math.round(cDeaths))+row('의료 역량',Math.round(S.m))+row('경제',Math.round(S.e))+row('행정 권한',Math.round(S.p))+row('유착',Math.round(S.c))+row('사회 갈등',Math.round(S.u))+row('개헌',CAR.amend+'회')+'</div>'+
   '<button id="again" style="width:100%;margin-bottom:8px;padding:14px;font-weight:600;background:#6250d6;border-color:#6250d6">새 인생 시작</button>'+
   '<button id="lbMine" style="display:block;width:100%;margin-bottom:8px;padding:13px;border-radius:10px;font-size:14px;font-weight:600;color:#f5c451;border:1px solid rgba(245,196,81,.45);background:rgba(245,196,81,.08)">명예의 전당에서 내 순위 보기</button>'+
   '<button id="cp" style="width:100%;font-size:13px">결과 복사하기</button></div>';
  if(first)setTimeout(()=>{SFX.grade(grade(C.perf));const el=document.getElementById('scn');if(el)countUp(el,csc,1400);},400);
  else document.getElementById('scn').textContent=csc;
  document.getElementById('again').onclick=()=>{SFX.click();home();};
  document.getElementById('lbMine').onclick=()=>{SFX.click();openBoard({back:()=>show(false),id:RUN.id,nick:NICK});};

function countUp(el,to,ms){const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/ms);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);})(t0);}
function copyText(t,btn){const orig=btn.textContent,done=()=>{btn.textContent='복사됨';setTimeout(()=>btn.textContent=orig,1600);};
  function fb(){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);done();}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb();}

/* ---------- 게임 안 명예의 전당 (리더보드) ---------- */

const LB={data:null,tab:'top',seen:null,fresh:new Set(),sig:'',timer:0,back:null,id:'',nick:'',busy:false,err:'',t0:0,open:false};

const lbEsc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lbAgo(t){const d=(Date.now()-new Date(t).getTime())/1000;if(!isFinite(d))return '';if(d<60)return '방금';if(d<3600)return Math.floor(d/60)+'분 전';if(d<86400)return Math.floor(d/3600)+'시간 전';
  const x=new Date(t);return (x.getMonth()+1)+'월 '+x.getDate()+'일';}
function lbJsonp(){return new Promise((res,rej)=>{const cb='__lbg'+Date.now()+Math.floor(Math.random()*1e4),s=document.createElement('script');
  const done=()=>{clearTimeout(to);try{delete window[cb];}catch(e){window[cb]=undefined;}s.remove();};
  const to=setTimeout(()=>{done();rej(new Error('시간 초과'));},12000);
  window[cb]=d=>{done();res(d);};s.onerror=()=>{done();rej(new Error('연결 실패'));};
  s.src=SHEET_URL+'?callback='+cb+'&t='+Date.now();document.head.appendChild(s);});}
function lbFetch(){return fetch(SHEET_URL+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).catch(()=>lbJsonp());}

function openBoard(o){o=o||{};LB.back=o.back||home;LB.id=o.id||'';LB.nick=o.nick||'';LB.tab='top';LB.open=true;LB.seen=null;LB.fresh=new Set();LB.sig='';
  window.scrollTo(0,0);lbFrame();
  if(LB.data){LB.sig=JSON.stringify(Object.assign({},LB.data,{updated:0}));LB.seen=new Set((LB.data.recent||[]).map(r=>r.id));lbRender(true);lbLive();}

function lbClose(){LB.open=false;clearTimeout(LB.timer);}
function lbSchedule(){clearTimeout(LB.timer);if(!LB.open)return;

  const waiting=LB.id&&LB.data&&LB.data.order&&LB.data.order.indexOf(LB.id)<0;

function lbLoad(){if(LB.busy||!LB.open)return;LB.busy=true;

    LB.err='';const sig=JSON.stringify(Object.assign({},d,{updated:0}));LB.data=d;
    if(!LB.open)return;
    if(sig!==LB.sig){const ids=new Set((d.recent||[]).map(r=>r.id));LB.fresh=new Set();if(LB.seen)ids.forEach(id=>{if(!LB.seen.has(id))LB.fresh.add(id);});

function lbPodium(list){const m=[list[1],list[0],list[2]],col=['#c9d1d9','#f5c451','#d08b5b'],rk=[2,1,3];

function lbBars(obj,colf){const a=Object.entries(obj||{}).sort((x,y)=>y[1]-x[1]);if(!a.length)return '<div class="lb-note">아직 데이터가 없어요.</div>';const mx=a[0][1];

function lbDir(rows){const W=300,H=140,mid=70,bw=(W-20)/5,sc=v=>Math.max(-1,Math.min(1,v/12))*54;
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="임기별 평균 권력 방향">';
  s+='<line x1="8" x2="'+(W-8)+'" y1="'+mid+'" y2="'+mid+'" stroke="rgba(255,255,255,.25)"/>';
  s+='<text x="10" y="11" font-size="9" fill="rgba(255,255,255,.45)">권력 집중 ↑</text><text x="10" y="'+(H-3)+'" font-size="9" fill="rgba(255,255,255,.45)">견제·분산 ↓</text>';
  rows.forEach((r,i)=>{const x=10+i*bw+bw*.22,w=bw*.56,cx=x+w/2;
    if(r.avg===null){s+='<text x="'+cx+'" y="'+(mid-6)+'" font-size="9" text-anchor="middle" fill="rgba(255,255,255,.3)">'+r.term+'기 없음</text>';return;}
    const h=sc(r.avg),y=h>=0?mid-h:mid,col=h>=0?'#f0605f':'#4a8fe0';
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(2,Math.abs(h)).toFixed(1)+'" rx="3" fill="'+col+'"/>';
    s+='<text x="'+cx+'" y="'+(h>=0?y-4:y+Math.abs(h)+11).toFixed(1)+'" font-size="10" font-weight="700" text-anchor="middle" fill="'+col+'">'+(r.avg>0?'+':'')+r.avg+'</text>';
    s+='<text x="'+cx+'" y="'+(h>=0?mid+12:mid-5)+'" font-size="9" text-anchor="middle" fill="rgba(255,255,255,.6)">'+r.term+'기 · '+r.n+'명</text>';});
  return s+'</svg>';}
function lbStats(){const s=LB.data.stats||{},dt=(s.dirByTerm&&s.dirByTerm.length)?s.dirByTerm:[1,2,3,4,5].map(t=>({term:t,n:0,avg:null}));

const SHEET_URL='https://script.google.com/macros/s/AKfycbzblt6BlpnAcGBtw_gPDeZcH1lYhOXSlFi8gA4sV7ONn4g_ZSusCazAqAlhyRTIhYXL/exec';
let NICK='익명',LOG=[],T0=0,RUN=null,SHOWN=0;
const NM={i:'확산',m:'의료',a:'지지율',e:'경제',p:'행정권한',c:'유착',u:'갈등',chk:'견제',trn:'투명성',saf:'안전망'};
const PRI={i:[-1,'방역'],e:[1,'경제'],a:[1,'여론'],m:[1,'의료'],saf:[1,'복지'],u:[-1,'사회 통합']};
// 권력 방향 점수 = 행정권한 + 유착 - 견제 - 투명성 (선택지에 설계된 효과 기준, 주사위 전)
function dirOf(e){if(e.X==='crush')return [30,'권력 집중'];if(e.X==='quit')return [0,'하야'];
  const v=(e.p||0)+(e.c||0)-(e.chk||0)-(e.trn||0);return [v,v>=5?'권력 집중':v<=-5?'견제·분산':'중립'];}
function priOf(e){let b='없음',bv=0;for(const k in PRI){const v=(e[k]||0)*PRI[k][0];if(v>bv){bv=v;b=PRI[k][1];}}return b;}
function effStr(e){if(e.X==='crush')return '강제 해산';if(e.X==='quit')return '하야';
  return Object.keys(e).filter(k=>NM[k]).map(k=>NM[k]+(e[k]>0?'+':'')+e[k]).join(' ');}
function etype(c){return c===UPR?'위기(전국 저항)':c===IMP?'위기(탄핵)':c.tm?'권력의 시험':Object.values(CH).indexOf(c)>=0?'연쇄 사건':'일반 사건';}
function stNow(){const o={};for(const k in NM)o[k]=Math.round(S[k]);o.deaths=Math.round(deaths);return o;}
function peak(){if(!RUN)return;RUN.pkP=Math.max(RUN.pkP,S.p);RUN.pkC=Math.max(RUN.pkC,S.c);}
function where(){const y=Math.min(YRS,Math.floor(S.turn/PY)+1);return {turn:S.turn+1,year:y,term:CAR.term,cyear:(CAR.term-1)*YRS+y,age:ageNow(),cturn:(CAR.term-1)*YRS*PY+S.turn+1};}
function pre(){const o={};for(const k in NM)o['b_'+k]=Math.round(S[k]);return o;}
function logChoice(k){const o=cur.o[k],d=dirOf(o[1]);peak();
  LOG.push(Object.assign({seq:LOG.length+1},where(),pre(),{event:cur.t,eventType:etype(cur),optionNo:k+1,nOptions:cur.o.length,
    choice:o[0],direction:d[1],dirScore:d[0],priority:priOf(o[1]),effects:effStr(o[1]),dice:'',rerolls:0,
    decideSec:SHOWN?Math.round((Date.now()-SHOWN)/100)/10:'',after:null}));
  if(cur===UPR||cur===IMP)RUN.crisis.push(CAR.term+'기 '+cur.t+': '+o[0]);}
function logSpecial(choice,ds,dl){const w=where();w.turn=YRS*PY;w.year=YRS;w.cyear=CAR.term*YRS;w.age=CAR.age0+CAR.term*YRS;w.cturn=CAR.term*YRS*PY;
  LOG.push(Object.assign({seq:LOG.length+1},w,pre(),{event:'임기 만료',eventType:'임기 결정',optionNo:'',nOptions:'',choice:choice,direction:dl,dirScore:ds,
    priority:'',effects:'',dice:'',rerolls:0,decideSec:SHOWN?Math.round((Date.now()-SHOWN)/100)/10:'',after:stNow()}));}
function logTier(t){const l=LOG[LOG.length-1];if(l){l.dice=TIER[t].n;l.after=null;}}
function logAfter(){const l=LOG[LOG.length-1];if(l)l.after=stNow();peak();}
function sendCareer(exitLabel,x){if(!SHEET_URL||!RUN||RUN.sent||!LOG.length)return;RUN.sent=1;
  const l=LOG[LOG.length-1];if(l&&!l.after)l.after=stNow();peak();
  x=x||{};const terms=CAR.terms.slice(),yrs=CAR.yrs.slice();
  if(CAR.tEval!==CAR.term){const pt=evalTerm('done');pt.decision=exitLabel;terms.push(pt);const py=partialYear();if(py)yrs.push(yearSnap(py,[],0));}
  const lt=terms[terms.length-1],C=careerStats();if(!x.lid){C.exit='';x.lid=leaderOf(C);}
  const N=LOG.filter(z=>z.eventType!=='임기 결정');
  const cnt=n=>N.filter(z=>z.direction===n).length;
  const avg=a=>a.length?Math.round(a.reduce((p,q)=>p+q,0)/a.length*10)/10:'';
  const yr=y=>avg(N.filter(z=>z.year===y).map(z=>z.dirScore)),tr=t=>avg(N.filter(z=>z.term===t).map(z=>z.dirScore));
  const fc=N.find(z=>z.direction==='권력 집중'),f=stNow(),good=CAR.tro.filter(t=>t.g).length;
  const years=x.years||((CAR.term-1)*YRS+Math.max(1,Math.ceil(S.turn/PY)));
  const run={id:RUN.id,startedAt:RUN.st,nickname:NICK,difficulty:DIFF[dif].n,perk:CAR.bg,era:MOD.n,
    endingId:lt.eid,ending:lt.ti,score:Math.round(lt.sc),grade:lt.g,playSeconds:Math.round((Date.now()-T0)/1000),months:years*12,
    a:f.a,i:f.i,peakI:lt.peakI,deaths:Math.round(cDeaths),m:f.m,e:f.e,p:f.p,c:f.c,u:f.u,chk:f.chk,trn:f.trn,saf:f.saf,
    ins:Math.round(lt.ins),peakP:Math.round(RUN.pkP),peakC:Math.round(RUN.pkC),auth:lt.auth?'예':'아니오',
    nChoices:N.length,nConc:cnt('권력 집중'),nDisp:cnt('견제·분산'),nNeut:cnt('중립'),avgDir:avg(N.map(z=>z.dirScore)),
    dirY1:yr(1),dirY2:yr(2),dirY3:yr(3),dirY4:yr(4),firstConcTurn:fc?fc.cturn:'',crisis:RUN.crisis.join(' / '),
    dice0:tally[0],dice1:tally[1],dice2:tally[2],dice3:tally[3],rerolls:RUN.rr,tokensLeft:tok,
    mode:MODE[mode].n,terms:CAR.term,careerYears:years,exitType:exitLabel,amendCount:CAR.amend,retireEligible:CAR.retireElig?'예':'아니오',
    leaderId:x.lid,leader:LEAD[x.lid].n,careerScore:x.csc===undefined?'':x.csc,scorePerf:x.SC?x.SC.perf:'',scoreCont:x.SC?x.SC.cont:'',scoreHonor:x.SC?x.SC.honor:'',trophiesGood:good,trophiesBad:CAR.tro.length-good,
    trophyList:CAR.tro.map(t=>(t.g?'+':'-')+t.n+'('+t.term+'-'+t.year+')').join(', '),
    termGrades:terms.map(t=>t.g).join('/'),termTitles:terms.map(t=>t.ti).join(' / '),
    dirT1:tr(1),dirT2:tr(2),dirT3:tr(3),dirT4:tr(4),dirT5:tr(5),ageStart:CAR.age0,ageEnd:CAR.age0+years,crushCount:CAR.crush,
    termScores:terms.map(t=>r1(t.sc)).join('/'),avgTermScore:r1(terms.reduce((s2,t)=>s2+t.sc,0)/terms.length),
    compA:lt.parts.a,compLife:lt.parts.life,compEco:lt.parts.eco,compClean:lt.parts.clean,compInst:lt.parts.inst,lifeScore:lt.parts.lifeScore,instScore:lt.parts.instScore,
    termDecisions:terms.map(t=>t.decision).join(' / '),yearsLogged:yrs.length};
  const termsOut=terms.map(t=>Object.assign({term:t.term,evalId:t.eid,evalTitle:t.ti,score:r1(t.sc),grade:t.g,decision:t.decision,months:t.months,ageStart:t.ageStart,
    peakI:t.peakI,deaths:t.deaths,cDeaths:t.cDeaths,ins:r1(t.ins),auth:t.auth?'예':'아니오',
    compA:t.parts.a,compLife:t.parts.life,compEco:t.parts.eco,compClean:t.parts.clean,compInst:t.parts.inst,lifeScore:t.parts.lifeScore,instScore:t.parts.instScore,
    nCh:t.nCh,nConc:t.nConc,nDisp:t.nDisp,nNeut:t.nNeut,avgDir:t.avgDir,dice0:t.dice[0],dice1:t.dice[1],dice2:t.dice[2],dice3:t.dice[3],troG:t.troG,troB:t.troB},t.ind));
  const choices=LOG.map(z=>{const o=Object.assign({},z,z.after||{});delete o.after;return o;});
  // 창을 닫아도 전송이 끝까지 가려면 한 번에 64KB 아래여야 한다. 넘치면 선택 기록을 여러 조각으로 나눠 보낸다.
  const size=t=>{try{return new TextEncoder().encode(t).length;}catch(e){return t.length*3;}},LIM=60000;
  const head={id:run.id,nickname:run.nickname,difficulty:run.difficulty,mode:run.mode,perk:run.perk,era:run.era};
  const parts=[];let curC=[],room=LIM-size(JSON.stringify({v:5,run:run,choices:[],terms:termsOut,years:yrs}));
  choices.forEach(c=>{const z=size(JSON.stringify(c))+1;if(z>room&&curC.length){parts.push(curC);curC=[];room=LIM-size(JSON.stringify({v:5,part:'more',run:head,choices:[]}));}curC.push(c);room-=z;});
  parts.push(curC);
  const bodies=parts.map((p,k)=>JSON.stringify(k===0?{v:5,run:run,choices:p,terms:termsOut,years:yrs}:{v:5,part:'more',run:head,choices:p}));
  bodies.forEach(t=>{try{fetch(SHEET_URL,{method:'POST',mode:'no-cors',keepalive:size(t)<63000,headers:{'Content-Type':'text/plain'},body:t}).catch(()=>{});}catch(e){}});}
// 커리어 도중에 창을 닫아도 그때까지의 기록을 보낸다
window.addEventListener('pagehide',()=>{try{if(RUN&&!RUN.sent&&LOG.length&&CAR&&!CAR.done)sendCareer('중도 이탈');}catch(e){}});
mload();
document.getElementById('go').onclick=()=>{NICK=(document.getElementById('nick').value||'').trim().slice(0,20)||'익명';aInit();SFX.coin();home();};
})();

</script>
